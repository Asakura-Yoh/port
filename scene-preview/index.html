<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Spine 4.2 Web Previewer - Supabase Backend Edition</title>
    
    <script src="https://unpkg.com/pixi.js@8.x/dist/pixi.min.js"></script>

    <style>
        :root { --bg-dark: #1e1e1e; --bg-panel: #252526; --bg-canvas: #333333; --accent: #007acc; --text: #cccccc; --border: #3e3e42; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-dark); color: var(--text); display: flex; height: 100vh; overflow: hidden; }

        #sidebar-left { width: 280px; background-color: var(--bg-panel); border-right: 1px solid #000; display: flex; flex-direction: column; z-index: 10; }
        #drop-zone { padding: 20px; text-align: center; border: 2px dashed #555; margin: 10px; background-color: #2d2d30; cursor: pointer; transition: 0.2s; font-size: 14px; }
        #drop-zone:hover { background-color: #3e3e42; border-color: #888; }
        #drop-zone.dragover { border-color: var(--accent); background-color: #1a2a3a; }
        .section-title { padding: 8px 12px; background-color: #383838; font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        #asset-list { flex-grow: 1; overflow-y: auto; padding: 10px; }
        .asset-item { background: #3e3e42; padding: 10px; margin-bottom: 5px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        .asset-item.ready { border-left: 4px solid #4caf50; }
        .asset-item.missing { border-left: 4px solid #f44336; }
        
        button.btn-add { padding: 6px 12px; cursor: pointer; background: var(--accent); color: #fff; border: none; border-radius: 3px; font-weight: bold; transition: 0.2s; }
        button.btn-add:hover { background: #005f9e; }
        button.btn-add:disabled { background: #555; cursor: not-allowed; }

        #main-view { flex-grow: 1; display: flex; justify-content: center; align-items: center; background-color: #111; padding: 20px; position: relative; }
        #canvas-wrapper { width: 100%; max-width: 1920px; aspect-ratio: 16 / 9; background-color: var(--bg-canvas); box-shadow: 0 0 20px rgba(0,0,0,0.8); position: relative; overflow: hidden; }
        canvas { width: 100%; height: 100%; display: block; }
        
        #toolbar { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 6px 12px; border-radius: 4px; font-size: 12px; pointer-events: none; z-index: 10; }
        #loading-overlay { position: absolute; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 20; color: #fff; font-weight: bold; font-size: 18px; }

        #sidebar-right { width: 300px; background-color: var(--bg-panel); border-left: 1px solid #000; display: flex; flex-direction: column; z-index: 10; }
        .inspector-panel { padding: 15px; display: none; }
        .inspector-group { margin-bottom: 15px; }
        .inspector-group label { display: block; font-size: 12px; margin-bottom: 5px; color: #aaa; }
        .inspector-group select { width: 100%; padding: 6px; background: #333; color: #fff; border: 1px solid var(--border); border-radius: 3px; outline: none; }
        .inspector-group select:focus { border-color: var(--accent); }
        .btn-delete { width: 100%; padding: 8px; background: #a83232; color: white; border: none; border-radius: 3px; cursor: pointer; margin-top: 10px; }
        .btn-delete:hover { background: #c23a3a; }
    </style>
</head>
<body>

    <div id="sidebar-left">
        <input type="file" id="file-input" multiple webkitdirectory directory style="display: none;">
        <div id="drop-zone">📁 Kéo thả Folder / Files<br>hoặc <strong>Click</strong> vào đây</div>
        <div class="section-title">Project Assets</div>
        <div id="asset-list"></div>
    </div>

    <div id="main-view">
        <div id="canvas-wrapper">
            <div id="toolbar">Left Click: Select/Move | Scroll Wheel: Scale</div>
            <div id="loading-overlay">Đang Upload Server & Khởi tạo... 🚀</div>
        </div>
    </div>

    <div id="sidebar-right">
        <div class="section-title">Inspector</div>
        <div id="inspector-content" class="inspector-panel">
            <div style="font-size: 16px; font-weight: bold; margin-bottom: 15px; color: var(--accent);" id="insp-name">Spine Object</div>
            <div class="inspector-group"><label>Animation</label><select id="insp-anim"></select></div>
            <div class="inspector-group"><label>Skin</label><select id="insp-skin"></select></div>
            <button class="btn-delete" onclick="deleteActiveObject()">Xóa khỏi Scene</button>
        </div>
        <div id="inspector-empty" style="padding: 20px; text-align: center; color: #666; font-size: 13px;">
            Click vào một nhân vật để xem thuộc tính.
        </div>
    </div>
