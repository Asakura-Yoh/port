<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spine 4.2 Web Previewer - Unity Inspector Edition</title>
    
    <script src="https://unpkg.com/pixi.js@8.x/dist/pixi.min.js"></script>
    <script src="https://unpkg.com/@esotericsoftware/spine-pixi-v8@4.2/dist/iife/spine-pixi-v8.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    
    <style>
        :root { --bg-dark: #1e1e1e; --bg-panel: #252526; --bg-canvas: #333333; --accent: #007acc; --text: #cccccc; --border: #3e3e42; --input-bg: #3c3c3c; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-dark); color: var(--text); display: flex; height: 100vh; overflow: hidden; }

        /* SIDEBAR LEFT */
        #sidebar-left { width: 300px; background-color: var(--bg-panel); border-right: 1px solid #000; display: flex; flex-direction: column; }
        #drop-zone { padding: 30px 20px; text-align: center; border: 2px dashed #555; margin: 15px; background-color: #2d2d30; cursor: pointer; border-radius: 8px; font-size: 13px; }
        #drop-zone.dragover { border-color: var(--accent); background-color: #1a2a3a; }
        #asset-list { flex-grow: 1; overflow-y: auto; padding: 10px; }
        .asset-item { background: #333; padding: 12px; margin-bottom: 8px; border-radius: 6px; border-left: 4px solid #555; transition: 0.2s; }
        .asset-item.ready { border-left-color: #4caf50; }
        .asset-item.loading { opacity: 0.6; pointer-events: none; }

        /* MAIN VIEW */
        #main-view { flex-grow: 1; display: flex; flex-direction: column; background-color: #111; position: relative; }
        #canvas-wrapper { flex-grow: 1; position: relative; overflow: hidden; background-image: radial-gradient(#333 1px, transparent 1px); background-size: 20px 20px; }
        canvas { width: 100%; height: 100%; display: block; }

        /* SIDEBAR RIGHT (INSPECTOR) */
        #sidebar-right { width: 320px; background-color: var(--bg-panel); border-left: 1px solid #000; display: flex; flex-direction: column; }
        .inspector-section { padding: 15px; border-bottom: 1px solid var(--border); }
        .section-header { font-size: 11px; font-weight: bold; text-transform: uppercase; color: #888; margin-bottom: 12px; display: flex; justify-content: space-between; }
        
        .property-row { display: flex; align-items: center; margin-bottom: 8px; font-size: 12px; }
        .property-label { width: 80px; color: #bbb; }
        .property-inputs { flex-grow: 1; display: flex; gap: 5px; }
        
        input[type="number"], select {
            background: var(--input-bg); border: 1px solid #222; color: #eee;
            padding: 4px 6px; border-radius: 3px; font-size: 12px; width: 100%; outline: none;
        }
        input:focus, select:focus { border-color: var(--accent); }
        .input-group { position: relative; display: flex; align-items: center; flex: 1; }
        .input-prefix { position: absolute; left: 5px; color: #666; font-size: 10px; pointer-events: none; }
        .input-group input { padding-left: 18px; }

        .btn-main { background: var(--accent); color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; }
        .btn-main:hover { background: #005f9e; }
        .btn-delete { background: #6e2e2e; margin-top: 20px; }

        #loading-overlay { position: absolute; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.8); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100; color: #fff; }
    </style>
</head>
<body>

    <div id="sidebar-left">
        <input type="file" id="file-input" multiple webkitdirectory directory style="display: none;">
        <div id="drop-zone">📁 Kéo thả Folder Spine vào đây<br><span style="font-size: 11px; color: #777;">(Tự động nhận diện cấu trúc)</span></div>
        <div class="section-header" style="padding: 0 15px;">Project Assets</div>
        <div id="asset-list"></div>
    </div>

    <div id="main-view">
        <div id="canvas-wrapper">
            <div id="loading-overlay">🚀 <span id="load-msg">Uploading...</span></div>
        </div>
    </div>

    <div id="sidebar-right">
        <div class="inspector-section" style="background: #2d2d2d;">
            <div style="font-size: 14px; font-weight: bold; color: var(--accent);" id="ins-title">No Object Selected</div>
        </div>

        <div id="inspector-body" style="display: none;">
            <div class="inspector-section">
                <div class="section-header">Transform</div>
                <div class="property-row">
                    <div class="property-label">Position</div>
                    <div class="property-inputs">
                        <div class="input-group"><span class="input-prefix">X</span><input type="number" id="field-x" step="10"></div>
                        <div class="input-group"><span class="input-prefix">Y</span><input type="number" id="field-y" step="10"></div>
                    </div>
                </div>
                <div class="property-row">
                    <div class="property-label">Scale</div>
                    <div class="property-inputs">
                        <div class="input-group"><span class="input-prefix">S</span><input type="number" id="field-scale" step="0.1" value="1"></div>
                    </div>
                </div>
            </div>

            <div class="inspector-section">
                <div class="section-header">Spine Renderer</div>
                <div class="property-row">
                    <div class="property-label">Animation</div>
                    <select id="sel-anim"></select>
                </div>
                <div class="property-row">
                    <div class="property-label">Skin</div>
                    <select id="sel-skin"></select>
                </div>
            </div>

            <div class="inspector-section">
                <button class="btn-main btn-delete" onclick="removeActive()">Remove from Scene</button>
            </div>
        </div>
    </div>

<script>
    // CONFIG SUPABASE
    const SUPABASE_URL = 'https://jxifynhuxcigcomhfxad.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_guA6fUpSMtATt1sZcPtK0g_vFVVlEig';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const BUCKET = 'spine-assets';

    const spineGroups = {};
    let activeObj = null;
    let app = null;

    // INIT PIXI
    (async () => {
        app = new PIXI.Application();
        await app.init({ width: 1920, height: 1080, backgroundColor: 0x333333, resolution: window.devicePixelRatio || 1, autoDensity: true });
        document.getElementById('canvas-wrapper').appendChild(app.canvas);
        app.stage.eventMode = 'static';
        app.stage.on('pointerdown', (e) => { if(e.target === app.stage) select(null); });
    })();

    // FOLDER LOADING LOGIC
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');

    dropZone.onclick = () => fileInput.click();
    fileInput.onchange = (e) => handleFiles(Array.from(e.target.files));
    
    dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('dragover'); };
    dropZone.ondragleave = () => dropZone.classList.remove('dragover');
    dropZone.ondrop = async (e) => {
        e.preventDefault(); dropZone.classList.remove('dragover');
        const files = [];
        const items = e.dataTransfer.items;
        for (let item of items) {
            const entry = item.webkitGetAsEntry();
            if (entry) await scanEntry(entry, files);
        }
        handleFiles(files);
    };

    async function scanEntry(entry, list) {
        if (entry.isFile) {
            const file = await new Promise(r => entry.file(r));
            list.push(file);
        } else if (entry.isDirectory) {
            const reader = entry.createReader();
            const entries = await new Promise(r => reader.readEntries(r));
            for (let e of entries) await scanEntry(e, list);
        }
    }

    function handleFiles(files) {
        files.forEach(f => {
            const match = f.name.match(/(.+)\.(json|skel|atlas|png)$/i);
            if (!match) return;
            const id = match[1];
            if (!spineGroups[id]) spineGroups[id] = { name: id };
            spineGroups[id][match[2].toLowerCase()] = f;
        });
        updateList();
    }

    function updateList() {
        const list = document.getElementById('asset-list');
        list.innerHTML = '';
        Object.values(spineGroups).forEach(g => {
            const ready = (g.json || g.skel) && g.atlas && g.png;
            const div = document.createElement('div');
            div.className = `asset-item ${ready ? 'ready' : ''}`;
            div.innerHTML = `
                <div style="font-weight:bold; margin-bottom:5px;">${g.name}</div>
                <button class="btn-main" ${!ready ? 'disabled' : ''} onclick="uploadAndSpawn('${g.name}')">
                    ${ready ? 'Upload & Add' : 'Missing Files'}
                </button>
            `;
            list.appendChild(div);
        });
    }

    // UPLOAD & SPAWN
    async function uploadAndSpawn(id) {
        const overlay = document.getElementById('loading-overlay');
        const msg = document.getElementById('load-msg');
        overlay.style.display = 'flex';

        try {
            const group = spineGroups[id];
            const uid = Date.now();
            const path = `${id}_${uid}/`;

            msg.innerText = "Uploading Texture...";
            await supabaseClient.storage.from(BUCKET).upload(path + group.png.name, group.png);
            
            msg.innerText = "Processing Atlas...";
            await supabaseClient.storage.from(BUCKET).upload(path + group.atlas.name, group.atlas);
            const atlasUrl = supabaseClient.storage.from(BUCKET).getPublicUrl(path + group.atlas.name).data.publicUrl;

            msg.innerText = "Uploading Skeleton...";
            const dataFile = group.json || group.skel;
            await supabaseClient.storage.from(BUCKET).upload(path + dataFile.name, dataFile);
            const dataUrl = supabaseClient.storage.from(BUCKET).getPublicUrl(path + dataFile.name).data.publicUrl;

            msg.innerText = "Initializing Spine...";
            const atlasAlias = `at_${uid}`;
            const dataAlias = `sk_${uid}`;
            
            PIXI.Assets.add({ alias: atlasAlias, src: atlasUrl, format: '.atlas' });
            PIXI.Assets.add({ alias: dataAlias, src: dataUrl, format: group.json ? '.json' : '.skel' });
            
            await PIXI.Assets.load([atlasAlias, dataAlias]);
            const spineObj = spine.Spine.from({ skeleton: dataAlias, atlas: atlasAlias });

            spineObj.x = 1920/2; spineObj.y = 1080/2;
            spineObj.eventMode = 'dynamic';
            spineObj.on('pointerdown', (e) => { e.stopPropagation(); select(spineObj); });
            
            // Drag logic
            let drag = false;
            spineObj.on('pointerdown', () => drag = true);
            app.stage.on('pointermove', (e) => {
                if(drag && activeObj === spineObj) {
                    activeObj.position.copyFrom(e.global);
                    syncInspector();
                }
            });
            window.addEventListener('pointerup', () => drag = false);

            app.stage.addChild(spineObj);
            select(spineObj);
        } catch (e) { alert(e.message); }
        overlay.style.display = 'none';
    }

    // INSPECTOR LOGIC
    function select(obj) {
        if(activeObj) activeObj.alpha = 1;
        activeObj = obj;
        const body = document.getElementById('inspector-body');
        const title = document.getElementById('ins-title');

        if(!obj) {
            body.style.display = 'none';
            title.innerText = "No Object Selected";
            return;
        }

        activeObj.alpha = 0.8;
        body.style.display = 'block';
        title.innerText = obj.name || "Spine Object";

        // Setup Anims
        const animSel = document.getElementById('sel-anim');
        animSel.innerHTML = '';
        obj.skeleton.data.animations.forEach(a => {
            const opt = document.createElement('option');
            opt.value = opt.innerText = a.name;
            animSel.appendChild(opt);
        });
        
        // Setup Skins
        const skinSel = document.getElementById('sel-skin');
        skinSel.innerHTML = '';
        obj.skeleton.data.skins.forEach(s => {
            const opt = document.createElement('option');
            opt.value = opt.innerText = s.name;
            skinSel.appendChild(opt);
        });

        syncInspector();
    }

    function syncInspector() {
        if(!activeObj) return;
        document.getElementById('field-x').value = Math.round(activeObj.x);
        document.getElementById('field-y').value = Math.round(activeObj.y);
        document.getElementById('field-scale').value = activeObj.scale.x.toFixed(2);
    }

    // Input listeners
    document.getElementById('field-x').oninput = (e) => activeObj.x = Number(e.target.value);
    document.getElementById('field-y').oninput = (e) => activeObj.y = Number(e.target.value);
    document.getElementById('field-scale').oninput = (e) => {
        const val = Number(e.target.value);
        activeObj.scale.set(val);
    };
    document.getElementById('sel-anim').onchange = (e) => activeObj.state.setAnimation(0, e.target.value, true);
    document.getElementById('sel-skin').onchange = (e) => {
        activeObj.skeleton.setSkinByName(e.target.value);
        activeObj.skeleton.setSlotsToSetupPose();
    };

    function removeActive() {
        if(activeObj) {
            app.stage.removeChild(activeObj);
            select(null);
        }
    }
</script>
</body>
</html>
