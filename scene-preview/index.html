<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spine 4.2 Web Previewer - Hardened Edition</title>
    
    <script src="https://unpkg.com/pixi.js@8.x/dist/pixi.min.js"></script>
    <script src="https://unpkg.com/@esotericsoftware/spine-pixi-v8@4.2/dist/iife/spine-pixi-v8.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    
    <style>
        :root { --bg-dark: #1a1a1a; --bg-panel: #252526; --accent: #007acc; --text: #cccccc; --border: #3e3e42; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text); 
            display: flex; 
            width: 100vw; height: 100vh; 
            overflow: hidden; 
        }

        /* Layout cố định để không bị Canvas đè */
        #sidebar-left { flex: 0 0 280px; background: var(--bg-panel); border-right: 1px solid #000; display: flex; flex-direction: column; }
        #main-view { flex: 1; position: relative; background: #111; overflow: hidden; display: flex; flex-direction: column; }
        #sidebar-right { flex: 0 0 300px; background: var(--bg-panel); border-left: 1px solid #000; display: flex; flex-direction: column; }

        #drop-zone { 
            margin: 15px; padding: 30px 10px; border: 2px dashed #444; 
            text-align: center; cursor: pointer; border-radius: 6px; font-size: 13px;
        }
        #drop-zone:hover { background: #333; border-color: var(--accent); }
        
        .section-header { padding: 10px 15px; background: #333; font-size: 11px; font-weight: bold; text-transform: uppercase; color: #888; }
        #asset-list { flex: 1; overflow-y: auto; padding: 10px; }
        .asset-item { background: #333; padding: 10px; margin-bottom: 8px; border-radius: 4px; font-size: 12px; }

        /* Inspector Styles */
        .ins-header { padding: 15px; background: #2d2d2d; color: var(--accent); font-weight: bold; border-bottom: 1px solid #111; }
        .ins-section { padding: 15px; border-bottom: 1px solid var(--border); }
        .prop-row { display: flex; align-items: center; margin-bottom: 10px; font-size: 12px; }
        .prop-label { width: 70px; color: #888; }
        .prop-input-group { flex: 1; display: flex; gap: 5px; }
        .input-box { flex: 1; position: relative; }
        .input-box span { position: absolute; left: 5px; top: 4px; font-size: 9px; color: #555; pointer-events: none; }
        
        input, select { 
            width: 100%; background: #111; border: 1px solid #333; color: #fff; 
            padding: 4px 4px 4px 15px; border-radius: 2px; outline: none; 
        }
        select { padding-left: 5px; }

        #loading-overlay { 
            position: absolute; inset: 0; background: rgba(0,0,0,0.8); 
            display: none; justify-content: center; align-items: center; z-index: 100; 
        }
        .btn-add { background: var(--accent); color: white; border: none; padding: 8px; border-radius: 4px; width: 100%; cursor: pointer; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>

    <div id="sidebar-left">
        <input type="file" id="file-input" multiple style="display: none;">
        <div id="drop-zone" onclick="document.getElementById('file-input').click()">
            📁 Click để chọn File<br><small>(Hoặc kéo thả folder vào đây)</small>
        </div>
        <div class="section-header">Project Assets</div>
        <div id="asset-list"></div>
    </div>

    <div id="main-view">
        <div id="loading-overlay">🚀 <span id="load-msg">Đang xử lý...</span></div>
        <div id="canvas-container" style="width:100%; height:100%;"></div>
    </div>

    <div id="sidebar-right">
        <div class="ins-header" id="ins-title">No Selection</div>
        <div id="ins-body" style="display: none;">
            <div class="ins-section">
                <div class="prop-row">
                    <div class="prop-label">Position</div>
                    <div class="prop-input-group">
                        <div class="input-box"><span>X</span><input type="number" id="ins-x"></div>
                        <div class="input-box"><span>Y</span><input type="number" id="ins-y"></div>
                    </div>
                </div>
                <div class="prop-row">
                    <div class="prop-label">Scale</div>
                    <div class="prop-input-group">
                        <div class="input-box"><span>S</span><input type="number" id="ins-scale" step="0.1"></div>
                    </div>
                </div>
            </div>
            <div class="ins-section">
                <div class="prop-row"><div class="prop-label">Anim</div><select id="ins-anim"></select></div>
                <div class="prop-row"><div class="prop-label">Skin</div><select id="ins-skin"></select></div>
            </div>
            <div class="ins-section">
                <button class="btn-add" style="background:#6e2e2e" onclick="removeObj()">Delete Object</button>
            </div>
        </div>
    </div>

<script>
    // --- KHỞI TẠO AN TOÀN ---
    const SB_URL = 'https://jxifynhuxcigcomhfxad.supabase.co';
    const SB_KEY = 'sb_publishable_guA6fUpSMtATt1sZcPtK0g_vFVVlEig';
    let supabase = null;
    try {
        if(window.supabase) supabase = window.supabase.createClient(SB_URL, SB_KEY);
    } catch(e) { console.error("Supabase Error", e); }

    const spineGroups = {};
    let activeObj = null;
    let app = null;

    (async () => {
        try {
            app = new PIXI.Application();
            await app.init({ 
                resizeTo: document.getElementById('canvas-container'),
                backgroundColor: 0x222222,
                antialias: true
            });
            document.getElementById('canvas-container').appendChild(app.canvas);
            app.stage.eventMode = 'static';
            app.stage.on('pointerdown', (e) => { if(e.target === app.stage) select(null); });
        } catch(e) { console.error("Pixi Init Error", e); }
    })();

    // --- XỬ LÝ FILE ---
    const fInput = document.getElementById('file-input');
    fInput.onchange = (e) => handleFiles(Array.from(e.target.files));

    function handleFiles(files) {
        files.forEach(f => {
            const match = f.name.match(/(.+)\.(json|skel|atlas|png)$/i);
            if (!match) return;
            const id = match[1];
            if (!spineGroups[id]) spineGroups[id] = { name: id };
            spineGroups[id][match[2].toLowerCase()] = f;
        });
        renderList();
    }

    function renderList() {
        const list = document.getElementById('asset-list');
        list.innerHTML = '';
        Object.values(spineGroups).forEach(g => {
            const ready = (g.json || g.skel) && g.atlas && g.png;
            const div = document.createElement('div');
            div.className = 'asset-item';
            div.innerHTML = `
                <b>${g.name}</b><br>
                <button class="btn-add" ${!ready ? 'disabled' : ''} onclick="upload('${g.name}')">
                    ${ready ? 'Upload & Add' : 'Missing Files'}
                </button>`;
            list.appendChild(div);
        });
    }

    async function upload(id) {
        if(!supabase) return alert("Backend chưa sẵn sàng!");
        const overlay = document.getElementById('loading-overlay');
        overlay.style.display = 'flex';
        
        try {
            const group = spineGroups[id];
            const uid = Date.now();
            const path = `${id}_${uid}/`;

            // Upload tuần tự để tránh lỗi
            await supabase.storage.from('spine-assets').upload(path + group.png.name, group.png);
            await supabase.storage.from('spine-assets').upload(path + group.atlas.name, group.atlas);
            const atlasUrl = supabase.storage.from('spine-assets').getPublicUrl(path + group.atlas.name).data.publicUrl;

            const dataFile = group.json || group.skel;
            await supabase.storage.from('spine-assets').upload(path + dataFile.name, dataFile);
            const dataUrl = supabase.storage.from('spine-assets').getPublicUrl(path + dataFile.name).data.publicUrl;

            // Load vào Pixi
            PIXI.Assets.add({ alias: 'at_'+uid, src: atlasUrl, format: '.atlas' });
            PIXI.Assets.add({ alias: 'sk_'+uid, src: dataUrl, format: group.json ? '.json' : '.skel' });
            
            await PIXI.Assets.load(['at_'+uid, 'sk_'+uid]);
            const spineObj = spine.Spine.from({ skeleton: 'sk_'+uid, atlas: 'at_'+uid });
            
            spawn(spineObj, id);
        } catch (e) { alert("Lỗi: " + e.message); }
        overlay.style.display = 'none';
    }

    function spawn(obj, name) {
        obj.name = name;
        obj.x = app.screen.width / 2;
        obj.y = app.screen.height / 2;
        obj.eventMode = 'static';
        obj.cursor = 'move';
        
        obj.on('pointerdown', (e) => { e.stopPropagation(); select(obj); });
        
        // Drag logic
        let drag = false;
        obj.on('pointerdown', () => drag = true);
        window.onpointermove = (e) => {
            if(drag && activeObj === obj) {
                const rect = document.getElementById('canvas-container').getBoundingClientRect();
                obj.x = e.clientX - rect.left;
                obj.y = e.clientY - rect.top;
                syncIns();
            }
        };
        window.onpointerup = () => drag = false;

        app.stage.addChild(obj);
        select(obj);
    }

    // --- INSPECTOR ---
    function select(obj) {
        if(activeObj) activeObj.alpha = 1;
        activeObj = obj;
        const body = document.getElementById('ins-body');
        const title = document.getElementById('ins-title');

        if(!obj) {
            body.style.display = 'none';
            title.innerText = "No Selection";
            return;
        }

        activeObj.alpha = 0.7;
        body.style.display = 'block';
        title.innerText = obj.name;

        // Populate Anims & Skins
        const aSel = document.getElementById('ins-anim');
        aSel.innerHTML = '';
        obj.skeleton.data.animations.forEach(a => {
            const opt = document.createElement('option');
            opt.value = opt.text = a.name;
            aSel.add(opt);
        });

        const sSel = document.getElementById('ins-skin');
        sSel.innerHTML = '';
        obj.skeleton.data.skins.forEach(s => {
            const opt = document.createElement('option');
            opt.value = opt.text = s.name;
            sSel.add(opt);
        });

        syncIns();
    }

    function syncIns() {
        if(!activeObj) return;
        document.getElementById('ins-x').value = Math.round(activeObj.x);
        document.getElementById('ins-y').value = Math.round(activeObj.y);
        document.getElementById('ins-scale').value = activeObj.scale.x.toFixed(2);
    }

    // Input Events
    document.getElementById('ins-x').oninput = (e) => activeObj.x = Number(e.target.value);
    document.getElementById('ins-y').oninput = (e) => activeObj.y = Number(e.target.value);
    document.getElementById('ins-scale').oninput = (e) => activeObj.scale.set(Number(e.target.value));
    document.getElementById('ins-anim').onchange = (e) => activeObj.state.setAnimation(0, e.target.value, true);
    document.getElementById('ins-skin').onchange = (e) => {
        activeObj.skeleton.setSkinByName(e.target.value);
        activeObj.skeleton.setSlotsToSetupPose();
    };

    function removeObj() {
        if(activeObj) { app.stage.removeChild(activeObj); select(null); }
    }
</script>
</body>
</html>
