<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spine 4.2 Pro Previewer - Compact UI Edition</title>
    
    <script src="https://unpkg.com/pixi.js@8.x/dist/pixi.min.js"></script>
    <script src="https://unpkg.com/@esotericsoftware/spine-pixi-v8@4.2/dist/iife/spine-pixi-v8.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    
    <style>
        :root { --bg-dark: #121212; --bg-panel: #1e1e1e; --accent: #007acc; --text: #cccccc; --border: #333333; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg-dark); color: var(--text); display: flex; width: 100vw; height: 100vh; overflow: hidden; position: relative; }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-panel); border-left: 1px solid #222; }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        .sidebar { background: var(--bg-panel); border: 1px solid #000; display: flex; flex-direction: column; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease; width: 300px; z-index: 10; flex-shrink: 0; }
        .sidebar.hidden { width: 0 !important; opacity: 0; pointer-events: none; border: none; }
        #sidebar-left { border-right: 1px solid #000; }
        #sidebar-right { border-left: 1px solid #000; }

        .toggle-btn {
            position: fixed; top: 15px; width: 32px; height: 32px; 
            background: #252526; color: #fff; border: 1px solid #444; 
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            z-index: 100; font-size: 14px; border-radius: 4px; transition: all 0.4s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .toggle-btn:hover { background: var(--accent); border-color: var(--accent); }
        #toggle-l { left: 315px; } 
        #toggle-r { right: 315px; }
        .btn-collapsed-l { left: 15px !important; }
        .btn-collapsed-r { right: 15px !important; }

        #main-view { flex: 1; background: #0b0b0b; display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden; }
        #canvas-wrapper { 
            aspect-ratio: 16 / 9; position: relative;
            width: min(98%, calc(94vh * 16 / 9)); max-height: 94vh;
            display: flex; justify-content: center; align-items: center;
            border: 1px solid #444; background: #1a1a1a; box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        #canvas-container { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        canvas { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
        #bottom-info { position: absolute; bottom: 20px; background: rgba(0,0,0,0.8); padding: 6px 20px; border-radius: 20px; font-size: 11px; color: #666; display: flex; gap: 25px; z-index: 5; }
        .scale-badge { color: var(--accent); font-weight: bold; }

        #drop-zone { margin: 15px; padding: 25px 10px; border: 2px dashed #444; text-align: center; cursor: pointer; border-radius: 6px; font-size: 11px; margin-top: 60px; }
        #asset-list { flex: 1; overflow-y: auto; padding: 10px; cursor: grab; }
        .asset-item { background: #2d2d2d; padding: 12px; margin-bottom: 8px; border-radius: 4px; border-left: 4px solid #555; cursor: default; }
        .asset-item.ready { border-left-color: #4caf50; }
        
        .ins-header-main { padding: 20px 15px; background: #252526; color: var(--accent); font-weight: bold; font-size: 14px; margin-top: 60px; border-bottom: 1px solid #000; }
        .prop-row { display: flex; align-items: center; margin-bottom: 12px; font-size: 12px; gap: 10px; }
        input, select { background: #121212; border: 1px solid #333; color: #fff; padding: 5px; font-size: 11px; width: 100%; outline: none; }
        input:disabled, select:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-ui { background: var(--accent); color: #fff; border: none; padding: 8px; cursor: pointer; width: 100%; font-weight: bold; border-radius: 4px; transition: 0.2s; }
        .btn-ui:hover { filter: brightness(1.2); }
        .btn-ui:disabled { opacity: 0.5; cursor: not-allowed; filter: none; }
        #loading-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }

        #hierarchy-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; cursor: grab; }
        .layer-item { background: #252526; border: 1px solid #333; border-radius: 4px; overflow: hidden; transition: all 0.2s; cursor: default; flex-shrink: 0; }
        .layer-item.active { border-color: var(--accent); box-shadow: 0 0 5px rgba(0,122,204,0.3); }
        .layer-item.dragging { opacity: 0.4; border: 1px dashed var(--accent); }
        .layer-item.is-hidden { opacity: 0.4; } 

        .layer-header { padding: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: #2d2d2d; font-size: 12px; font-weight: bold; user-select: none; }
        .layer-header:hover { background: #383838; }
        .layer-header .drag-handle { cursor: grab; padding-right: 10px; color: #888; font-size: 14px; }
        .visibility-toggle { cursor: pointer; padding: 0 5px; font-size: 14px; transition: opacity 0.2s; user-select: none; }
        .visibility-toggle:hover { opacity: 1 !important; transform: scale(1.1); }
        
        .layer-header .toggle-icon { font-size: 10px; color: #666; transition: transform 0.2s; display: inline-block; }
        .layer-item.expanded .toggle-icon { transform: rotate(90deg); }
        .layer-body { padding: 15px; background: #1a1a1a; border-top: 1px solid #111; display: none; }
        .layer-item.expanded .layer-body { display: block; }
        
        .attach-badge { color: #e6a822; font-size: 9px; margin-left: 5px; display: none; }
        .layer-item.attached .attach-badge { display: inline; }
    </style>
</head>
<body>

    <button class="toggle-btn" id="toggle-l" onclick="toggleSidebar('left')">◀</button>
    <button class="toggle-btn" id="toggle-r" onclick="toggleSidebar('right')">▶</button>

    <div id="sidebar-left" class="sidebar">
        <input type="file" id="file-folder" webkitdirectory directory multiple style="display:none">
        <input type="file" id="update-file-input" multiple accept=".json,.skel,.atlas,.png" style="display:none">

        <div id="drop-zone" onclick="document.getElementById('file-folder').click()">
            📁 Drop Folder Spine Here<br><small>Canvas: 1920 x 1080</small>
        </div>
        <div id="asset-list"></div>
    </div>

    <div id="main-view">
        <div id="canvas-wrapper">
            <div id="canvas-container"></div>
        </div>
        <div id="bottom-info">
            <span>Drag: Move Asset | Grid: 1920x1080</span>
            <span>View Scale: <span id="view-scale" class="scale-badge">100%</span></span>
        </div>
        <div id="loading-overlay">🚀 <span id="load-status" style="margin-top:10px;">Processing...</span></div>
    </div>

    <div id="sidebar-right" class="sidebar">
        <div class="ins-header-main">Scene Layers</div>
        <div id="hierarchy-list">
            <div id="empty-state" style="padding: 20px; text-align: center; color: #555; font-size: 11px;">No assets in scene</div>
        </div>
    </div>

<script>
    const SB_URL = 'https://jxifynhuxcigcomhfxad.supabase.co';
    const SB_KEY = 'sb_publishable_guA6fUpSMtATt1sZcPtK0g_vFVVlEig';
    const supabaseClient = window.supabase.createClient(SB_URL, SB_KEY);
    const BUCKET = 'spine-assets';

    const spineFiles = {};
    let activeObj = null;
    let app = null;
    let currentUpdateId = null;

    const LOGICAL_WIDTH = 1920;
    const LOGICAL_HEIGHT = 1080;

    (async () => {
        app = new PIXI.Application();
        await app.init({ 
            width: LOGICAL_WIDTH, height: LOGICAL_HEIGHT,
            backgroundColor: 0x1a1a1a, antialias: true,
            resolution: window.devicePixelRatio || 1, autoDensity: true
        });
        document.getElementById('canvas-container').appendChild(app.canvas);
        app.stage.sortableChildren = true;
        app.stage.eventMode = 'static';
        app.stage.hitArea = new PIXI.Rectangle(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);
        app.stage.on('pointerdown', (e) => { if(e.target === app.stage) select(null); });
        
        updateScaleDisplay();
        window.addEventListener('resize', updateScaleDisplay);
        setupDragAndDropList();
        enableDragScroll('asset-list');
        enableDragScroll('hierarchy-list');
        
        app.ticker.add(() => {
            app.stage.children.forEach(child => {
                if (child.attachedParentUid && child.attachedBoneName) {
                    const parent = app.stage.children.find(c => c.uid === child.attachedParentUid);
                    if (parent && parent.skeleton) {
                        const bone = parent.skeleton.findBone(child.attachedBoneName);
                        if (bone) {
                            child.x = parent.x + bone.worldX * parent.scale.x;
                            child.y = parent.y - bone.worldY * parent.scale.y;
                            if (activeObj === child) {
                                const layerDOM = document.getElementById(child.uid);
                                if(layerDOM) {
                                    layerDOM.querySelector('.ins-x').value = Math.round(child.x);
                                    layerDOM.querySelector('.ins-y').value = Math.round(child.y);
                                }
                            }
                        }
                    }
                }
            });
        });
    })();

    function enableDragScroll(elementId) {
        const el = document.getElementById(elementId);
        let isDown = false; let startY; let scrollTop;
        el.addEventListener('mousedown', (e) => {
            if (['INPUT', 'SELECT', 'OPTION', 'BUTTON'].includes(e.target.tagName)) return;
            if (e.target.closest('.layer-header') || e.target.closest('.btn-lock')) return;
            isDown = true; el.style.cursor = 'grabbing';
            startY = e.pageY - el.offsetTop; scrollTop = el.scrollTop;
        });
        el.addEventListener('mouseleave', () => { isDown = false; el.style.cursor = 'grab'; });
        el.addEventListener('mouseup', () => { isDown = false; el.style.cursor = 'grab'; });
        el.addEventListener('mousemove', (e) => {
            if (!isDown) return;
            e.preventDefault();
            const walk = (e.pageY - el.offsetTop - startY) * 1.5; 
            el.scrollTop = scrollTop - walk;
        });
    }

    function toggleSidebar(side) {
        const el = document.getElementById(`sidebar-${side}`);
        const btn = document.getElementById(`toggle-${side === 'left' ? 'l' : 'r'}`);
        el.classList.toggle('hidden');
        if (side === 'left') {
            btn.innerText = el.classList.contains('hidden') ? '▶' : '◀';
            btn.classList.toggle('btn-collapsed-l');
        } else {
            btn.innerText = el.classList.contains('hidden') ? '◀' : '▶';
            btn.classList.toggle('btn-collapsed-r');
        }
        setTimeout(updateScaleDisplay, 450);
    }

    function updateScaleDisplay() {
        const wrapper = document.getElementById('canvas-wrapper');
        if (!wrapper) return;
        const scale = (wrapper.clientWidth / LOGICAL_WIDTH) * 100;
        document.getElementById('view-scale').innerText = Math.round(scale) + "%";
    }

    const fFolder = document.getElementById('file-folder');
    fFolder.onchange = (e) => handleFiles(Array.from(e.target.files));

    function handleFiles(files) {
        files.forEach(f => {
            const match = f.name.match(/(.+)\.(json|skel|atlas|png)$/i);
            if (!match) return;
            const id = match[1];
            if (!spineFiles[id]) spineFiles[id] = { name: id };
            spineFiles[id][match[2].toLowerCase()] = f;
        });
        renderList();
    }

    const fUpdate = document.getElementById('update-file-input');
    function triggerUpdate(id) {
        currentUpdateId = id;
        fUpdate.click(); 
    }

    fUpdate.onchange = async (e) => {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;
        files.forEach(f => {
            const match = f.name.match(/\.(json|skel|atlas|png)$/i);
            if (match) { spineFiles[currentUpdateId][match[1].toLowerCase()] = f; }
        });
        renderList();
        await executeLiveUpdate(currentUpdateId);
        fUpdate.value = ""; 
    };

    function renderList() {
        const list = document.getElementById('asset-list');
        list.innerHTML = '';
        Object.values(spineFiles).forEach(g => {
            const ready = (g.json || g.skel) && g.atlas && g.png;
            const div = document.createElement('div');
            div.className = `asset-item ${ready ? 'ready' : ''}`;
            div.innerHTML = `
                <b>${g.name}</b><br>
                <div style="display:flex; gap:5px; margin-top:8px">
                    <button class="btn-ui" style="flex:1" ${!ready ? 'disabled' : ''} onclick="uploadAndAdd('${g.name}')">Add to Scene</button>
                    <button class="btn-ui" style="flex:1; background:#d48a1a" ${!ready ? 'disabled' : ''} onclick="triggerUpdate('${g.name}')">Update</button>
                </div>
            `;
            list.appendChild(div);
        });
    }

    async function uploadAndAdd(id) {
        document.getElementById('load-status').innerText = "Uploading & Loading...";
        document.getElementById('loading-overlay').style.display = 'flex';
        try {
            const group = spineFiles[id];
            const uid = Date.now();
            const folder = `${id}_${uid}/`;

            await supabaseClient.storage.from(BUCKET).upload(folder + group.png.name, group.png);
            await supabaseClient.storage.from(BUCKET).upload(folder + group.atlas.name, group.atlas);
            const atlasUrl = supabaseClient.storage.from(BUCKET).getPublicUrl(folder + group.atlas.name).data.publicUrl;

            const dataFile = group.json || group.skel;
            await supabaseClient.storage.from(BUCKET).upload(folder + dataFile.name, dataFile);
            const dataUrl = supabaseClient.storage.from(BUCKET).getPublicUrl(folder + dataFile.name).data.publicUrl;

            const atlasKey = `at_${uid}`;
            const dataKey = `sk_${uid}`;
            PIXI.Assets.add({ alias: atlasKey, src: atlasUrl, format: '.atlas' });
            PIXI.Assets.add({ alias: dataKey, src: dataUrl, format: group.json ? '.json' : '.skel' });
            
            await PIXI.Assets.load([atlasKey, dataKey]);
            const spineObj = spine.Spine.from({ skeleton: dataKey, atlas: atlasKey });
            
            spineObj.skeletonKey = dataKey;
            spineObj.atlasKey = atlasKey;
            spineObj.attachedParentUid = null;
            spineObj.attachedBoneName = null;
            
            spawn(spineObj, id, id);
        } catch (e) { alert(e.message); }
        document.getElementById('loading-overlay').style.display = 'none';
    }

    async function executeLiveUpdate(id) {
        document.getElementById('load-status').innerText = "Updating Asset in Scene...";
        document.getElementById('loading-overlay').style.display = 'flex';
        
        try {
            const group = spineFiles[id];
            const uid = Date.now();
            const folder = `${id}_update_${uid}/`;

            await supabaseClient.storage.from(BUCKET).upload(folder + group.png.name, group.png);
            await supabaseClient.storage.from(BUCKET).upload(folder + group.atlas.name, group.atlas);
            const atlasUrl = supabaseClient.storage.from(BUCKET).getPublicUrl(folder + group.atlas.name).data.publicUrl;

            const dataFile = group.json || group.skel;
            await supabaseClient.storage.from(BUCKET).upload(folder + dataFile.name, dataFile);
            const dataUrl = supabaseClient.storage.from(BUCKET).getPublicUrl(folder + dataFile.name).data.publicUrl;

            const atlasKey = `at_${uid}`;
            const dataKey = `sk_${uid}`;
            PIXI.Assets.add({ alias: atlasKey, src: atlasUrl, format: '.atlas' });
            PIXI.Assets.add({ alias: dataKey, src: dataUrl, format: group.json ? '.json' : '.skel' });
            
            await PIXI.Assets.load([atlasKey, dataKey]);

            const existingInstances = app.stage.children.filter(c => c.baseAssetId === id);
            const statesToRestore = existingInstances.map(c => {
                const dom = document.getElementById(c.uid);
                return {
                    uid: c.uid, name: c.name, x: c.x, y: c.y,
                    scaleX: c.scale.x, scaleY: c.scale.y,
                    zIndex: c.zIndex, visible: c.visible,
                    anim: c.state.tracks[0] ? c.state.tracks[0].animation.name : null,
                    skin: c.skeleton.skin ? c.skeleton.skin.name : null,
                    attachedParentUid: c.attachedParentUid, attachedBoneName: c.attachedBoneName,
                    isLocked: dom ? dom.querySelector('.btn-lock').classList.contains('locked') : true
                };
            });

            existingInstances.forEach(c => {
                const dom = document.getElementById(c.uid);
                if(dom) dom.remove();
                app.stage.removeChild(c);
            });
            if(activeObj && activeObj.baseAssetId === id) select(null);

            statesToRestore.forEach(state => {
                const spineObj = spine.Spine.from({ skeleton: dataKey, atlas: atlasKey });
                spineObj.skeletonKey = dataKey; spineObj.atlasKey = atlasKey;
                spawn(spineObj, state.name, id, state);
            });

            reorderDOMBasedOnZIndex();

        } catch (e) { alert(e.message); }
        document.getElementById('loading-overlay').style.display = 'none';
    }

    function spawn(obj, name, baseAssetId, restoreState = null) {
        obj.baseAssetId = baseAssetId;
        obj.name = name;
        obj.eventMode = 'static'; obj.cursor = 'move';
        
        if(restoreState) {
            obj.uid = restoreState.uid;
            obj.x = restoreState.x; obj.y = restoreState.y;
            obj.scale.set(restoreState.scaleX, restoreState.scaleY);
            obj.visible = restoreState.visible;
            obj.zIndex = restoreState.zIndex;
            obj.attachedParentUid = restoreState.attachedParentUid;
            obj.attachedBoneName = restoreState.attachedBoneName;
        } else {
            obj.uid = 'spine_' + Date.now() + '_' + Math.floor(Math.random()*1000);
            obj.x = LOGICAL_WIDTH / 2; obj.y = LOGICAL_HEIGHT / 2;
            obj.visible = true; obj.attachedParentUid = null; obj.attachedBoneName = null;
            if (obj.state.data.skeletonData.animations.length > 0) {
                obj.state.setAnimation(0, obj.state.data.skeletonData.animations[0].name, true);
            }
        }

        obj.on('pointerdown', (e) => { e.stopPropagation(); select(obj); });
        
        let drag = false;
        obj.on('pointerdown', () => drag = true);
        window.addEventListener('pointermove', (e) => {
            if(drag && activeObj === obj) {
                if(obj.attachedParentUid && obj.attachedBoneName) return;

                const rect = app.canvas.getBoundingClientRect();
                const scaleX = LOGICAL_WIDTH / rect.width;
                const scaleY = LOGICAL_HEIGHT / rect.height;
                obj.x = (e.clientX - rect.left) * scaleX;
                obj.y = (e.clientY - rect.top) * scaleY;
                
                const layerDOM = document.getElementById(obj.uid);
                if(layerDOM) {
                    layerDOM.querySelector('.ins-x').value = Math.round(obj.x);
                    layerDOM.querySelector('.ins-y').value = Math.round(obj.y);
                }
            }
        });
        window.addEventListener('pointerup', () => drag = false);

        app.stage.addChild(obj);
        createHierarchyNode(obj, restoreState);
        select(obj);
        checkEmptyState();
    }

    function createHierarchyNode(obj, restoreState = null) {
        const list = document.getElementById('hierarchy-list');
        const div = document.createElement('div');
        div.className = `layer-item expanded active ${!obj.visible ? 'is-hidden' : ''}`;
        div.id = obj.uid;
        
        if (restoreState && restoreState.attachedParentUid) { div.classList.add('attached'); }

        const eyeIcon = obj.visible ? '👁️' : '➖';
        const eyeOpacity = obj.visible ? '1' : '0.4';
        
        div.innerHTML = `
            <div class="layer-header" draggable="true">
                <div>
                    <span class="drag-handle">↕</span> 
                    <span class="visibility-toggle" style="opacity:${eyeOpacity}" title="Toggle Visibility">${eyeIcon}</span>
                    <span class="layer-name">${obj.name}</span>
                    <span class="attach-badge">🔗 Attached</span>
                </div>
                <div class="toggle-icon">▶</div>
            </div>
            <div class="layer-body">
                <div class="prop-row">
                    <div style="width:60px; color:#e6a822;">Attach 🔗</div>
                    <select class="ins-attach-parent" style="width:48%; background:#2a2515; border-color:#e6a822"><option value="">- Parent Asset -</option></select>
                    <select class="ins-attach-bone" style="width:48%; background:#2a2515; border-color:#e6a822" ${(!restoreState || !restoreState.attachedParentUid) ? 'disabled' : ''}><option value="">- Bone -</option></select>
                </div>
                <hr style="border-color:#222; margin: 10px 0;">
                
                <div class="prop-row"><div style="width:60px">Layer Z</div><input type="number" class="ins-z"></div>
                
                <div class="prop-row">
                    <div style="width:60px">Position</div>
                    <div style="display:flex; flex:1; gap:4px; align-items:center;">
                        <span style="color:#888; font-size:10px;">X</span>
                        <input type="number" class="ins-x" value="${Math.round(obj.x)}" style="min-width:0; flex:1;" ${(restoreState && restoreState.attachedParentUid) ? 'disabled' : ''}>
                        <span style="color:#888; font-size:10px; margin-left:4px;">Y</span>
                        <input type="number" class="ins-y" value="${Math.round(obj.y)}" style="min-width:0; flex:1;" ${(restoreState && restoreState.attachedParentUid) ? 'disabled' : ''}>
                    </div>
                </div>
                
                <div class="prop-row">
                    <div style="width:60px">Scale</div>
                    <div style="display:flex; flex:1; gap:4px; align-items:center;">
                        <span style="color:#888; font-size:10px;">X</span>
                        <input type="number" class="ins-scale-x" step="0.05" value="${obj.scale.x.toFixed(2)}" title="Scale X" style="min-width:0; flex:1;">
                        <span class="btn-lock locked" title="Lock Ratio" style="cursor:pointer; font-size:12px; user-select:none;">🔗</span>
                        <span style="color:#888; font-size:10px;">Y</span>
                        <input type="number" class="ins-scale-y" step="0.05" value="${obj.scale.y.toFixed(2)}" title="Scale Y" style="min-width:0; flex:1;">
                    </div>
                </div>

                <div class="prop-row">
                    <div style="width:60px">Anim</div>
                    <select class="ins-anim" style="flex:1;"></select>
                </div>
                <div class="prop-row">
                    <div style="width:60px">Skin</div>
                    <select class="ins-skin" style="flex:1;"></select>
                </div>

                <div style="display: flex; gap: 8px; margin-top: 10px;">
                    <button class="btn-ui btn-duplicate" style="background:#007acc; flex:1;">Duplicate</button>
                    <button class="btn-ui btn-remove" style="background:#8b2a2a; flex:1;">Remove</button>
                </div>
            </div>
        `;

        const aSel = div.querySelector('.ins-anim');
        obj.skeleton.data.animations.forEach(a => { const opt = document.createElement('option'); opt.value = opt.text = a.name; aSel.add(opt); });
        
        const sSel = div.querySelector('.ins-skin');
        obj.skeleton.data.skins.forEach(s => { const opt = document.createElement('option'); opt.value = opt.text = s.name; sSel.add(opt); });
        
        if (restoreState) {
            if(restoreState.skin) { try { obj.skeleton.setSkinByName(restoreState.skin); obj.skeleton.setSlotsToSetupPose(); sSel.value = restoreState.skin; } catch(e){} }
            else if (obj.skeleton.skin) sSel.value = obj.skeleton.skin.name;

            if(restoreState.anim) { try { obj.state.setAnimation(0, restoreState.anim, true); aSel.value = restoreState.anim; } catch(e){} }
            else if(obj.state.tracks[0]) aSel.value = obj.state.tracks[0].animation.name;
        } else {
            if(obj.skeleton.skin) sSel.value = obj.skeleton.skin.name;
            if(obj.state.tracks[0]) aSel.value = obj.state.tracks[0].animation.name;
        }

        const header = div.querySelector('.layer-header');
        header.addEventListener('click', (e) => { 
            if(e.target.classList.contains('visibility-toggle')) return;
            div.classList.toggle('expanded'); 
            select(obj); 
        });

        const visToggle = div.querySelector('.visibility-toggle');
        visToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            obj.visible = !obj.visible;
            if(obj.visible) {
                visToggle.innerText = '👁️'; visToggle.style.opacity = '1'; div.classList.remove('is-hidden');
            } else {
                visToggle.innerText = '➖'; visToggle.style.opacity = '0.4'; div.classList.add('is-hidden');
            }
        });

        header.addEventListener('dragstart', (e) => { e.dataTransfer.setData('text/plain', obj.uid); setTimeout(() => div.classList.add('dragging'), 0); });
        header.addEventListener('dragend', () => { div.classList.remove('dragging'); });

        const xInput = div.querySelector('.ins-x');
        const yInput = div.querySelector('.ins-y');
        xInput.oninput = (e) => obj.x = Number(e.target.value);
        yInput.oninput = (e) => obj.y = Number(e.target.value);
        div.querySelector('.ins-anim').onchange = (e) => obj.state.setAnimation(0, e.target.value, true);
        div.querySelector('.ins-skin').onchange = (e) => { obj.skeleton.setSkinByName(e.target.value); obj.skeleton.setSlotsToSetupPose(); };
        div.querySelector('.ins-z').onchange = (e) => { obj.zIndex = Number(e.target.value); app.stage.sortChildren(); reorderDOMBasedOnZIndex(); };

        const scaleXIn = div.querySelector('.ins-scale-x');
        const scaleYIn = div.querySelector('.ins-scale-y');
        const btnLock = div.querySelector('.btn-lock');
        
        let isLocked = restoreState ? restoreState.isLocked : true;
        let lockRatio = obj.scale.y / (obj.scale.x || 1); 

        if (!isLocked) {
            btnLock.classList.remove('locked'); btnLock.innerText = '🔓'; btnLock.style.opacity = '0.5';
        }

        btnLock.addEventListener('click', (e) => {
            e.stopPropagation();
            isLocked = !isLocked;
            if (isLocked) {
                btnLock.classList.add('locked'); btnLock.innerText = '🔗'; btnLock.style.opacity = '1';
                lockRatio = obj.scale.y / (obj.scale.x || 1); 
            } else {
                btnLock.classList.remove('locked'); btnLock.innerText = '🔓'; btnLock.style.opacity = '0.5';
            }
        });

        scaleXIn.oninput = (e) => {
            const val = Number(e.target.value); obj.scale.x = val;
            if (isLocked) { const newY = val * lockRatio; obj.scale.y = newY; scaleYIn.value = newY.toFixed(2); }
        };

        scaleYIn.oninput = (e) => {
            const val = Number(e.target.value); obj.scale.y = val;
            if (isLocked) { const newX = lockRatio !== 0 ? val / lockRatio : 0; obj.scale.x = newX; scaleXIn.value = newX.toFixed(2); }
        };

        const parentSel = div.querySelector('.ins-attach-parent');
        const boneSel = div.querySelector('.ins-attach-bone');
        
        if (restoreState && restoreState.attachedParentUid) {
            const parentObj = app.stage.children.find(c => c.uid === restoreState.attachedParentUid);
            if (parentObj) {
                parentSel.innerHTML = `<option value="${parentObj.uid}">${parentObj.name}</option>`;
                parentObj.skeleton.bones.forEach(b => {
                    const opt = document.createElement('option'); opt.value = opt.text = b.data.name; boneSel.add(opt);
                });
                boneSel.value = restoreState.attachedBoneName;
            }
        }

        parentSel.addEventListener('focus', () => {
            const currentVal = parentSel.value;
            parentSel.innerHTML = '<option value="">- None -</option>';
            app.stage.children.forEach(c => {
                if (c.uid !== obj.uid && c.skeleton) {
                    const opt = document.createElement('option');
                    opt.value = c.uid; opt.text = c.name;
                    parentSel.add(opt);
                }
            });
            parentSel.value = currentVal;
        });

        parentSel.onchange = (e) => {
            const pId = e.target.value;
            boneSel.innerHTML = '<option value="">- Select Bone -</option>';
            if (pId) {
                const parentObj = app.stage.children.find(c => c.uid === pId);
                if (parentObj) {
                    parentObj.skeleton.bones.forEach(b => {
                        const opt = document.createElement('option'); opt.value = opt.text = b.data.name; boneSel.add(opt);
                    });
                    boneSel.disabled = false;
                }
            } else {
                boneSel.disabled = true; obj.attachedParentUid = null; obj.attachedBoneName = null;
                div.classList.remove('attached'); xInput.disabled = false; yInput.disabled = false;
            }
        };

        boneSel.onchange = (e) => {
            if(e.target.value) {
                obj.attachedParentUid = parentSel.value; obj.attachedBoneName = e.target.value;
                div.classList.add('attached'); xInput.disabled = true; yInput.disabled = true;
            } else {
                obj.attachedBoneName = null; obj.attachedParentUid = null;
                div.classList.remove('attached'); xInput.disabled = false; yInput.disabled = false;
            }
        };

        div.querySelector('.btn-duplicate').onclick = (e) => {
            e.stopPropagation();
            const clone = spine.Spine.from({ skeleton: obj.skeletonKey, atlas: obj.atlasKey });
            clone.skeletonKey = obj.skeletonKey; clone.atlasKey = obj.atlasKey;
            
            const stateForClone = {
                uid: 'spine_' + Date.now() + '_' + Math.floor(Math.random()*1000),
                x: obj.x + 50, y: obj.y + 50,
                scaleX: obj.scale.x, scaleY: obj.scale.y,
                zIndex: obj.zIndex, visible: obj.visible,
                anim: obj.state.tracks[0] ? obj.state.tracks[0].animation.name : null,
                skin: obj.skeleton.skin ? obj.skeleton.skin.name : null,
                attachedParentUid: null, attachedBoneName: null,
                isLocked: isLocked
            };
            
            let baseName = obj.name;
            const nameMatch = obj.name.match(/^(.*)_(\d+)$/);
            if (nameMatch) baseName = nameMatch[1]; 
            
            let maxNum = 0;
            app.stage.children.forEach(child => {
                if (child.name && child.name.startsWith(baseName + '_')) {
                    const suffix = child.name.substring(baseName.length + 1);
                    if (/^\d+$/.test(suffix)) {
                        const num = parseInt(suffix, 10);
                        if (num > maxNum) maxNum = num;
                    }
                }
            });
            
            spawn(clone, baseName + '_' + (maxNum + 1), obj.baseAssetId, stateForClone);
        };

        div.querySelector('.btn-remove').onclick = (e) => {
            e.stopPropagation();
            app.stage.children.forEach(c => {
                if(c.attachedParentUid === obj.uid) {
                    c.attachedParentUid = null; c.attachedBoneName = null;
                    const childDom = document.getElementById(c.uid);
                    if(childDom) {
                        childDom.classList.remove('attached');
                        childDom.querySelector('.ins-attach-parent').value = "";
                        childDom.querySelector('.ins-attach-bone').innerHTML = '<option value="">- Bone -</option>';
                        childDom.querySelector('.ins-attach-bone').disabled = true;
                        childDom.querySelector('.ins-x').disabled = false; childDom.querySelector('.ins-y').disabled = false;
                    }
                }
            });
            app.stage.removeChild(obj); div.remove();
            if(activeObj === obj) select(null);
            checkEmptyState();
        };

        list.prepend(div); 
        if(!restoreState) updateZIndexesFromDOM(); 
        else { div.querySelector('.ins-z').value = restoreState.zIndex; }
    }

    function select(obj) {
        if(activeObj) {
            activeObj.alpha = 1;
            const prev = document.getElementById(activeObj.uid);
            if(prev) prev.classList.remove('active');
        }
        activeObj = obj;
        if(obj) {
            const current = document.getElementById(obj.uid);
            if(current) {
                current.classList.add('active');
                current.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }
    }

    function checkEmptyState() {
        const list = document.getElementById('hierarchy-list');
        const empty = document.getElementById('empty-state');
        if(list.querySelectorAll('.layer-item').length === 0) empty.style.display = 'block';
        else empty.style.display = 'none';
    }

    function setupDragAndDropList() {
        const list = document.getElementById('hierarchy-list');
        list.addEventListener('dragover', e => {
            e.preventDefault();
            const afterElement = getDragAfterElement(list, e.clientY);
            const dragging = document.querySelector('.dragging');
            if(dragging) {
                if (afterElement == null) list.appendChild(dragging);
                else list.insertBefore(dragging, afterElement);
            }
        });
        list.addEventListener('drop', e => { e.preventDefault(); updateZIndexesFromDOM(); });
    }

    function getDragAfterElement(container, y) {
        const draggableElements = [...container.querySelectorAll('.layer-item:not(.dragging)')];
        return draggableElements.reduce((closest, child) => {
            const box = child.getBoundingClientRect();
            const offset = y - box.top - box.height / 2;
            if (offset < 0 && offset > closest.offset) return { offset: offset, element: child };
            else return closest;
        }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    function updateZIndexesFromDOM() {
        const items = document.querySelectorAll('.layer-item');
        let z = items.length;
        items.forEach(item => {
            const uid = item.id;
            const targetObj = app.stage.children.find(c => c.uid === uid);
            if (targetObj) { targetObj.zIndex = z; item.querySelector('.ins-z').value = z; }
            z--;
        });
        app.stage.sortChildren();
    }

    function reorderDOMBasedOnZIndex() {
        const list = document.getElementById('hierarchy-list');
        const items = Array.from(list.querySelectorAll('.layer-item'));
        items.sort((a, b) => {
            const zA = Number(a.querySelector('.ins-z').value);
            const zB = Number(b.querySelector('.ins-z').value);
            return zB - zA; 
        });
        items.forEach(item => list.appendChild(item)); 
    }
</script>
</body>
