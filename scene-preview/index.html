<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spine 4.2 Pro Previewer - Smart Duplicate Edition</title>
    
    <script src="https://unpkg.com/pixi.js@8.x/dist/pixi.min.js"></script>
    <script src="https://unpkg.com/@esotericsoftware/spine-pixi-v8@4.2/dist/iife/spine-pixi-v8.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    
    <style>
        :root { --bg-dark: #121212; --bg-panel: #1e1e1e; --accent: #007acc; --text: #cccccc; --border: #333333; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg-dark); color: var(--text); display: flex; width: 100vw; height: 100vh; overflow: hidden; position: relative; }

        /* SIDEBARS */
        .sidebar { background: var(--bg-panel); border: 1px solid #000; display: flex; flex-direction: column; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease; width: 300px; z-index: 10; flex-shrink: 0; }
        .sidebar.hidden { width: 0 !important; opacity: 0; pointer-events: none; border: none; }
        
        #sidebar-left { border-right: 1px solid #000; }
        #sidebar-right { border-left: 1px solid #000; }

        /* TOGGLE BUTTONS */
        .toggle-btn {
            position: fixed; top: 15px; width: 32px; height: 32px; 
            background: #252526; color: #fff; border: 1px solid #444; 
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            z-index: 100; font-size: 14px; border-radius: 4px; transition: all 0.4s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .toggle-btn:hover { background: var(--accent); border-color: var(--accent); }
        #toggle-l { left: 315px; } 
        #toggle-r { right: 315px; }
        .btn-collapsed-l { left: 15px !important; }
        .btn-collapsed-r { right: 15px !important; }

        /* MAIN VIEWPORT */
        #main-view { 
            flex: 1; 
            background: #0b0b0b; 
            display: flex; 
            justify-content: center; 
            align-items: center;     
            position: relative; 
            overflow: hidden; 
        }
        
        #canvas-wrapper { 
            aspect-ratio: 16 / 9; 
            position: relative;
            width: min(98%, calc(94vh * 16 / 9)); 
            max-height: 94vh;
            display: flex; 
            justify-content: center; 
            align-items: center;
            border: 1px solid #444; 
            background: #1a1a1a; 
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        #canvas-container { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        canvas { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }

        /* BOTTOM INFO */
        #bottom-info { position: absolute; bottom: 20px; background: rgba(0,0,0,0.8); padding: 6px 20px; border-radius: 20px; font-size: 11px; color: #666; display: flex; gap: 25px; z-index: 5; }
        .scale-badge { color: var(--accent); font-weight: bold; }

        /* LEFT SIDEBAR UI */
        #drop-zone { margin: 15px; padding: 25px 10px; border: 2px dashed #444; text-align: center; cursor: pointer; border-radius: 6px; font-size: 11px; margin-top: 60px; }
        #asset-list { flex: 1; overflow-y: auto; padding: 10px; }
        .asset-item { background: #2d2d2d; padding: 12px; margin-bottom: 8px; border-radius: 4px; border-left: 4px solid #555; }
        .asset-item.ready { border-left-color: #4caf50; }
        
        .ins-header-main { padding: 20px 15px; background: #252526; color: var(--accent); font-weight: bold; font-size: 14px; margin-top: 60px; border-bottom: 1px solid #000; }
        .prop-row { display: flex; align-items: center; margin-bottom: 12px; font-size: 12px; gap: 10px; }
        input, select { background: #121212; border: 1px solid #333; color: #fff; padding: 5px; font-size: 11px; width: 100%; outline: none; }
        .btn-ui { background: var(--accent); color: #fff; border: none; padding: 8px; cursor: pointer; width: 100%; font-weight: bold; border-radius: 4px; transition: 0.2s; }
        .btn-ui:hover { filter: brightness(1.2); }
        #loading-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }

        /* RIGHT SIDEBAR (HIERARCHY & LAYERS) CSS */
        #hierarchy-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .layer-item { background: #252526; border: 1px solid #333; border-radius: 4px; overflow: hidden; transition: border-color 0.2s; }
        .layer-item.active { border-color: var(--accent); box-shadow: 0 0 5px rgba(0,122,204,0.3); }
        .layer-item.dragging { opacity: 0.4; border: 1px dashed var(--accent); }
        
        .layer-header { padding: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: #2d2d2d; font-size: 12px; font-weight: bold; user-select: none; }
        .layer-header:hover { background: #383838; }
        .layer-header .drag-handle { cursor: grab; padding-right: 10px; color: #888; font-size: 14px; }
        .layer-header .toggle-icon { font-size: 10px; color: #666; transition: transform 0.2s; display: inline-block; }
        .layer-item.expanded .toggle-icon { transform: rotate(90deg); }
        
        .layer-body { padding: 15px; background: #1a1a1a; border-top: 1px solid #111; display: none; }
        .layer-item.expanded .layer-body { display: block; }
    </style>
</head>
<body>

    <button class="toggle-btn" id="toggle-l" onclick="toggleSidebar('left')">◀</button>
    <button class="toggle-btn" id="toggle-r" onclick="toggleSidebar('right')">▶</button>

    <div id="sidebar-left" class="sidebar">
        <input type="file" id="file-folder" webkitdirectory directory multiple style="display:none">
        <div id="drop-zone" onclick="document.getElementById('file-folder').click()">
            📁 Drop Folder Spine Here<br><small>Canvas: 1920 x 1080</small>
        </div>
        <div id="asset-list"></div>
    </div>

    <div id="main-view">
        <div id="canvas-wrapper">
            <div id="canvas-container"></div>
        </div>
        
        <div id="bottom-info">
            <span>Drag: Move | Scroll: Scale | Grid: 1920x1080</span>
            <span>View Scale: <span id="view-scale" class="scale-badge">100%</span></span>
        </div>
        
        <div id="loading-overlay">🚀 <span id="load-status">Uploading...</span></div>
    </div>

    <div id="sidebar-right" class="sidebar">
        <div class="ins-header-main">Scene Layers</div>
        <div id="hierarchy-list">
            <div id="empty-state" style="padding: 20px; text-align: center; color: #555; font-size: 11px;">No assets in scene</div>
        </div>
    </div>

<script>
    const SB_URL = 'https://jxifynhuxcigcomhfxad.supabase.co';
    const SB_KEY = 'sb_publishable_guA6fUpSMtATt1sZcPtK0g_vFVVlEig';
    const supabaseClient = window.supabase.createClient(SB_URL, SB_KEY);
    const BUCKET = 'spine-assets';

    const spineFiles = {};
    let activeObj = null;
    let app = null;

    const LOGICAL_WIDTH = 1920;
    const LOGICAL_HEIGHT = 1080;

    (async () => {
        app = new PIXI.Application();
        await app.init({ 
            width: LOGICAL_WIDTH, height: LOGICAL_HEIGHT,
            backgroundColor: 0x1a1a1a, antialias: true,
            resolution: window.devicePixelRatio || 1, autoDensity: true
        });
        document.getElementById('canvas-container').appendChild(app.canvas);
        app.stage.sortableChildren = true;
        app.stage.eventMode = 'static';
        app.stage.hitArea = new PIXI.Rectangle(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);
        app.stage.on('pointerdown', (e) => { if(e.target === app.stage) select(null); });
        
        updateScaleDisplay();
        window.addEventListener('resize', updateScaleDisplay);
        setupDragAndDropList();
    })();

    function toggleSidebar(side) {
        const el = document.getElementById(`sidebar-${side}`);
        const btn = document.getElementById(`toggle-${side === 'left' ? 'l' : 'r'}`);
        el.classList.toggle('hidden');
        
        if (side === 'left') {
            btn.innerText = el.classList.contains('hidden') ? '▶' : '◀';
            btn.classList.toggle('btn-collapsed-l');
        } else {
            btn.innerText = el.classList.contains('hidden') ? '◀' : '▶';
            btn.classList.toggle('btn-collapsed-r');
        }
        
        setTimeout(updateScaleDisplay, 450);
    }

    function updateScaleDisplay() {
        const wrapper = document.getElementById('canvas-wrapper');
        if (!wrapper) return;
        const scale = (wrapper.clientWidth / LOGICAL_WIDTH) * 100;
        document.getElementById('view-scale').innerText = Math.round(scale) + "%";
    }

    const fFolder = document.getElementById('file-folder');
    fFolder.onchange = (e) => handleFiles(Array.from(e.target.files));

    function handleFiles(files) {
        files.forEach(f => {
            const match = f.name.match(/(.+)\.(json|skel|atlas|png)$/i);
            if (!match) return;
            const id = match[1];
            if (!spineFiles[id]) spineFiles[id] = { name: id };
            spineFiles[id][match[2].toLowerCase()] = f;
        });
        renderList();
    }

    function renderList() {
        const list = document.getElementById('asset-list');
        list.innerHTML = '';
        Object.values(spineFiles).forEach(g => {
            const ready = (g.json || g.skel) && g.atlas && g.png;
            const div = document.createElement('div');
            div.className = `asset-item ${ready ? 'ready' : ''}`;
            div.innerHTML = `<b>${g.name}</b><br><button class="btn-ui" ${!ready ? 'disabled' : ''} onclick="uploadAndAdd('${g.name}')">Add to Scene</button>`;
            list.appendChild(div);
        });
    }

    async function uploadAndAdd(id) {
        document.getElementById('loading-overlay').style.display = 'flex';
        try {
            const group = spineFiles[id];
            const uid = Date.now();
            const folder = `${id}_${uid}/`;

            await supabaseClient.storage.from(BUCKET).upload(folder + group.png.name, group.png);
            await supabaseClient.storage.from(BUCKET).upload(folder + group.atlas.name, group.atlas);
            const atlasUrl = supabaseClient.storage.from(BUCKET).getPublicUrl(folder + group.atlas.name).data.publicUrl;

            const dataFile = group.json || group.skel;
            await supabaseClient.storage.from(BUCKET).upload(folder + dataFile.name, dataFile);
            const dataUrl = supabaseClient.storage.from(BUCKET).getPublicUrl(folder + dataFile.name).data.publicUrl;

            const atlasKey = `at_${uid}`;
            const dataKey = `sk_${uid}`;
            PIXI.Assets.add({ alias: atlasKey, src: atlasUrl, format: '.atlas' });
            PIXI.Assets.add({ alias: dataKey, src: dataUrl, format: group.json ? '.json' : '.skel' });
            
            await PIXI.Assets.load([atlasKey, dataKey]);
            const spineObj = spine.Spine.from({ skeleton: dataKey, atlas: atlasKey });
            
            spineObj.skeletonKey = dataKey;
            spineObj.atlasKey = atlasKey;
            
            spawn(spineObj, id);
        } catch (e) { alert(e.message); }
        document.getElementById('loading-overlay').style.display = 'none';
    }

    function spawn(obj, name) {
        obj.uid = 'spine_' + Date.now() + '_' + Math.floor(Math.random()*1000);
        obj.name = name;
        obj.x = LOGICAL_WIDTH / 2; obj.y = LOGICAL_HEIGHT / 2;
        obj.eventMode = 'static'; obj.cursor = 'move';
        
        if (obj.state.data.skeletonData.animations.length > 0) {
            obj.state.setAnimation(0, obj.state.data.skeletonData.animations[0].name, true);
        }

        obj.on('pointerdown', (e) => { e.stopPropagation(); select(obj); });
        
        let drag = false;
        obj.on('pointerdown', () => drag = true);
        window.addEventListener('pointermove', (e) => {
            if(drag && activeObj === obj) {
                const rect = app.canvas.getBoundingClientRect();
                const scaleX = LOGICAL_WIDTH / rect.width;
                const scaleY = LOGICAL_HEIGHT / rect.height;
                obj.x = (e.clientX - rect.left) * scaleX;
                obj.y = (e.clientY - rect.top) * scaleY;
                
                const layerDOM = document.getElementById(obj.uid);
                if(layerDOM) {
                    layerDOM.querySelector('.ins-x').value = Math.round(obj.x);
                    layerDOM.querySelector('.ins-y').value = Math.round(obj.y);
                }
            }
        });
        window.addEventListener('pointerup', () => drag = false);

        app.stage.addChild(obj);
        createHierarchyNode(obj);
        select(obj);
        checkEmptyState();
    }

    function createHierarchyNode(obj) {
        const list = document.getElementById('hierarchy-list');
        const div = document.createElement('div');
        div.className = 'layer-item expanded active';
        div.id = obj.uid;
        
        div.innerHTML = `
            <div class="layer-header" draggable="true">
                <div><span class="drag-handle">↕</span> <span class="layer-name">${obj.name}</span></div>
                <div class="toggle-icon">▶</div>
            </div>
            <div class="layer-body">
                <div class="prop-row">
                    <div style="width:60px">Layer Z</div>
                    <input type="number" class="ins-z" title="Thứ tự lớp (Số lớn nằm trên)">
                </div>
                <div class="prop-row"><div style="width:60px">Pos X</div><input type="number" class="ins-x" value="${Math.round(obj.x)}"></div>
                <div class="prop-row"><div style="width:60px">Pos Y</div><input type="number" class="ins-y" value="${Math.round(obj.y)}"></div>
                <div class="prop-row"><div style="width:60px">Scale</div><input type="number" class="ins-scale" step="0.05" value="${obj.scale.x.toFixed(2)}"></div>
                <div class="prop-row"><select class="ins-anim"></select></div>
                <div class="prop-row"><select class="ins-skin"></select></div>
                <div style="display: flex; gap: 8px; margin-top: 10px;">
                    <button class="btn-ui btn-duplicate" style="background:#007acc; flex:1;">Duplicate</button>
                    <button class="btn-ui btn-remove" style="background:#8b2a2a; flex:1;">Remove</button>
                </div>
            </div>
        `;

        const aSel = div.querySelector('.ins-anim');
        obj.skeleton.data.animations.forEach(a => {
            const opt = document.createElement('option'); opt.value = opt.text = a.name; aSel.add(opt);
        });
        if(obj.state.tracks[0]) aSel.value = obj.state.tracks[0].animation.name;

        const sSel = div.querySelector('.ins-skin');
        obj.skeleton.data.skins.forEach(s => {
            const opt = document.createElement('option'); opt.value = opt.text = s.name; sSel.add(opt);
        });
        if(obj.skeleton.skin) sSel.value = obj.skeleton.skin.name;

        const header = div.querySelector('.layer-header');
        header.addEventListener('click', () => {
            div.classList.toggle('expanded');
            select(obj);
        });

        header.addEventListener('dragstart', (e) => {
            e.dataTransfer.setData('text/plain', obj.uid);
            setTimeout(() => div.classList.add('dragging'), 0);
        });
        header.addEventListener('dragend', () => {
            div.classList.remove('dragging');
        });

        div.querySelector('.ins-x').oninput = (e) => obj.x = Number(e.target.value);
        div.querySelector('.ins-y').oninput = (e) => obj.y = Number(e.target.value);
        div.querySelector('.ins-scale').oninput = (e) => obj.scale.set(Number(e.target.value));
        div.querySelector('.ins-anim').onchange = (e) => obj.state.setAnimation(0, e.target.value, true);
        div.querySelector('.ins-skin').onchange = (e) => { obj.skeleton.setSkinByName(e.target.value); obj.skeleton.setSlotsToSetupPose(); };
        
        div.querySelector('.ins-z').onchange = (e) => {
            obj.zIndex = Number(e.target.value);
            app.stage.sortChildren();
            reorderDOMBasedOnZIndex();
        };

        // EVENT: LOGIC ĐỔI TÊN THÔNG MINH CHO DUPLICATE
        div.querySelector('.btn-duplicate').onclick = (e) => {
            e.stopPropagation();
            
            const clone = spine.Spine.from({ skeleton: obj.skeletonKey, atlas: obj.atlasKey });
            clone.skeletonKey = obj.skeletonKey;
            clone.atlasKey = obj.atlasKey;
            
            const currentAnim = obj.state.tracks[0] ? obj.state.tracks[0].animation.name : null;
            const currentSkin = obj.skeleton.skin ? obj.skeleton.skin.name : null;
            const currentX = obj.x;
            const currentY = obj.y;
            const currentScale = obj.scale.x;
            
            // Xử lý tên: Tách base name và tìm số thứ tự lớn nhất
            let baseName = obj.name;
            const nameMatch = obj.name.match(/^(.*)_(\d+)$/);
            if (nameMatch) {
                baseName = nameMatch[1]; 
            }
            
            let maxNum = 0;
            app.stage.children.forEach(child => {
                if (child.name && child.name.startsWith(baseName + '_')) {
                    const suffix = child.name.substring(baseName.length + 1);
                    if (/^\d+$/.test(suffix)) {
                        const num = parseInt(suffix, 10);
                        if (num > maxNum) maxNum = num;
                    }
                }
            });
            const newName = baseName + '_' + (maxNum + 1); // Tăng dần 1, 2, 3...
            
            spawn(clone, newName);
            
            clone.x = currentX;
            clone.y = currentY;
            clone.scale.set(currentScale);
            
            if (currentSkin) {
                clone.skeleton.setSkinByName(currentSkin);
                clone.skeleton.setSlotsToSetupPose();
            }
            if (currentAnim) {
                clone.state.setAnimation(0, currentAnim, true);
            }
            
            const newLayerDOM = document.getElementById(clone.uid);
            if (newLayerDOM) {
                newLayerDOM.querySelector('.ins-x').value = Math.round(clone.x);
                newLayerDOM.querySelector('.ins-y').value = Math.round(clone.y);
                newLayerDOM.querySelector('.ins-scale').value = clone.scale.x.toFixed(2);
                if (currentAnim) newLayerDOM.querySelector('.ins-anim').value = currentAnim;
                if (currentSkin) newLayerDOM.querySelector('.ins-skin').value = currentSkin;
            }
        };

        div.querySelector('.btn-remove').onclick = (e) => {
            e.stopPropagation();
            app.stage.removeChild(obj);
            div.remove();
            if(activeObj === obj) select(null);
            checkEmptyState();
        };

        list.prepend(div); 
        updateZIndexesFromDOM(); 
    }

    function select(obj) {
        if(activeObj) {
            activeObj.alpha = 1;
            const prev = document.getElementById(activeObj.uid);
            if(prev) prev.classList.remove('active');
        }
        activeObj = obj;
        if(obj) {
            const current = document.getElementById(obj.uid);
            if(current) {
                current.classList.add('active');
                current.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }
    }

    function checkEmptyState() {
        const list = document.getElementById('hierarchy-list');
        const empty = document.getElementById('empty-state');
        if(list.querySelectorAll('.layer-item').length === 0) empty.style.display = 'block';
        else empty.style.display = 'none';
    }

    function setupDragAndDropList() {
        const list = document.getElementById('hierarchy-list');
        list.addEventListener('dragover', e => {
            e.preventDefault();
            const afterElement = getDragAfterElement(list, e.clientY);
            const dragging = document.querySelector('.dragging');
            if(dragging) {
                if (afterElement == null) list.appendChild(dragging);
                else list.insertBefore(dragging, afterElement);
            }
        });
        
        list.addEventListener('drop', e => {
            e.preventDefault();
            updateZIndexesFromDOM();
        });
    }

    function getDragAfterElement(container, y) {
        const draggableElements = [...container.querySelectorAll('.layer-item:not(.dragging)')];
        return draggableElements.reduce((closest, child) => {
            const box = child.getBoundingClientRect();
            const offset = y - box.top - box.height / 2;
            if (offset < 0 && offset > closest.offset) return { offset: offset, element: child };
            else return closest;
        }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    function updateZIndexesFromDOM() {
        const items = document.querySelectorAll('.layer-item');
        let z = items.length;
        items.forEach(item => {
            const uid = item.id;
            const targetObj = app.stage.children.find(c => c.uid === uid);
            if (targetObj) {
                targetObj.zIndex = z;
                item.querySelector('.ins-z').value = z; 
            }
            z--;
        });
        app.stage.sortChildren();
    }

    function reorderDOMBasedOnZIndex() {
        const list = document.getElementById('hierarchy-list');
        const items = Array.from(list.querySelectorAll('.layer-item'));
        items.sort((a, b) => {
            const zA = Number(a.querySelector('.ins-z').value);
            const zB = Number(b.querySelector('.ins-z').value);
            return zB - zA; 
        });
        items.forEach(item => list.appendChild(item)); 
    }
</script>
</body>
</html>
