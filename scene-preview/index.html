<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spine 4.2 Web Previewer - Unity Edition</title>
    
    <script src="https://unpkg.com/pixi.js@8.x/dist/pixi.min.js"></script>
    <script src="https://unpkg.com/@esotericsoftware/spine-pixi-v8@4.2/dist/iife/spine-pixi-v8.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    
    <style>
        :root { --bg-dark: #1e1e1e; --bg-panel: #252526; --bg-canvas: #333333; --accent: #007acc; --text: #cccccc; --border: #3e3e42; --input-bg: #1a1a1a; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text); 
            display: flex; 
            width: 100vw;
            height: 100vh; 
            overflow: hidden; 
        }

        /* SIDEBAR LEFT: Asset Management */
        #sidebar-left { 
            flex: 0 0 300px; 
            background-color: var(--bg-panel); 
            border-right: 1px solid #000; 
            display: flex; 
            flex-direction: column; 
        }
        
        #drop-zone { 
            padding: 25px 15px; 
            text-align: center; 
            border: 2px dashed #444; 
            margin: 15px; 
            background-color: #2d2d30; 
            cursor: pointer; 
            border-radius: 6px; 
            font-size: 12px;
            transition: 0.2s;
        }
        #drop-zone:hover { background-color: #3e3e42; border-color: #666; }
        #drop-zone.dragover { border-color: var(--accent); background-color: #1a2a3a; }

        .section-header { 
            padding: 10px 15px; 
            background: #333; 
            font-size: 11px; 
            font-weight: bold; 
            text-transform: uppercase; 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #asset-list { flex-grow: 1; overflow-y: auto; padding: 10px; }
        
        .asset-item { 
            background: #333; 
            padding: 10px; 
            margin-bottom: 8px; 
            border-radius: 4px; 
            font-size: 12px;
            border-left: 3px solid #555;
        }
        .asset-item.ready { border-left-color: #4caf50; }

        /* MAIN VIEW: The Stage */
        #main-view { 
            flex: 1; 
            background-color: #111; 
            position: relative; 
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #canvas-wrapper { flex: 1; position: relative; }
        canvas { width: 100%; height: 100%; display: block; }

        /* SIDEBAR RIGHT: Unity Inspector */
        #sidebar-right { 
            flex: 0 0 320px; 
            background-color: var(--bg-panel); 
            border-left: 1px solid #000; 
            display: flex; 
            flex-direction: column; 
            z-index: 100;
        }

        .inspector-panel { display: flex; flex-direction: column; height: 100%; }
        .ins-header { 
            padding: 15px; 
            background: #2d2d2d; 
            color: var(--accent); 
            font-weight: bold; 
            font-size: 14px; 
            border-bottom: 1px solid #111;
        }

        .ins-section { padding: 15px; border-bottom: 1px solid var(--border); }
        .ins-label { font-size: 11px; color: #888; text-transform: uppercase; margin-bottom: 10px; display: block; }

        .prop-row { display: flex; align-items: center; margin-bottom: 10px; gap: 10px; }
        .prop-name { width: 60px; font-size: 12px; color: #aaa; }
        .prop-fields { flex: 1; display: flex; gap: 5px; }

        .field-group { position: relative; flex: 1; }
        .field-group span { position: absolute; left: 5px; top: 5px; color: #555; font-size: 10px; pointer-events: none; }
        
        input[type="number"], select {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid #111;
            color: #fff;
            padding: 5px 5px 5px 18px;
            font-size: 12px;
            border-radius: 2px;
            outline: none;
        }
        select { padding-left: 5px; }
        input:focus { border-color: var(--accent); }

        .btn-action {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 8px;
            border-radius: 3px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
            margin-top: 5px;
        }
        .btn-action:hover { background: #005f9e; }
        .btn-action:disabled { background: #444; cursor: not-allowed; }
        .btn-danger { background: #6e2e2e; margin-top: 15px; }

        #loading-overlay { 
            position: absolute; top:0; left:0; right:0; bottom:0; 
            background: rgba(0,0,0,0.85); display: none; 
            flex-direction: column; justify-content: center; align-items: center; 
            z-index: 999; 
        }

        #toolbar { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 5px 10px; font-size: 11px; color: #aaa; border-radius: 4px; pointer-events: none; }
    </style>
</head>
<body>

    <div id="sidebar-left">
        <input type="file" id="file-input" multiple webkitdirectory directory style="display: none;">
        <div id="drop-zone">📁 Kéo thả Folder Spine vào đây<br><small>Tự động nhận diện Folder/File</small></div>
        
        <div class="section-header">
            <span>Project Assets</span>
            <button onclick="uploadAll()" style="font-size: 9px; background: #444; border:none; color:#ccc; padding:2px 5px; cursor:pointer;">Upload All</button>
        </div>
        <div id="asset-list"></div>
    </div>

    <div id="main-view">
        <div id="toolbar">Click object to Select | Drag to Move | Wheel to Scale</div>
        <div id="canvas-wrapper"></div>
        <div id="loading-overlay">🚀 <span id="load-status">Processing...</span></div>
    </div>

    <div id="sidebar-right">
        <div class="inspector-panel">
            <div class="ins-header" id="ins-title">No Selection</div>
            
            <div id="ins-content" style="display: none;">
                <div class="ins-section">
                    <span class="ins-label">Transform</span>
                    <div class="prop-row">
                        <div class="prop-name">Position</div>
                        <div class="prop-fields">
                            <div class="field-group"><span>X</span><input type="number" id="ins-x"></div>
                            <div class="field-group"><span>Y</span><input type="number" id="ins-y"></div>
                        </div>
                    </div>
                    <div class="prop-row">
                        <div class="prop-name">Scale</div>
                        <div class="prop-fields">
                            <div class="field-group"><span>S</span><input type="number" id="ins-scale" step="0.1"></div>
                        </div>
                    </div>
                </div>

                <div class="ins-section">
                    <span class="ins-label">Spine Renderer</span>
                    <div class="prop-row">
                        <div class="prop-name">Animation</div>
                        <select id="ins-anim"></select>
                    </div>
                    <div class="prop-row">
                        <div class="prop-name">Skin</div>
                        <select id="ins-skin"></select>
                    </div>
                </div>

                <div class="ins-section">
                    <button class="btn-action btn-danger" onclick="deleteActive()">Remove Object</button>
                </div>
            </div>
        </div>
    </div>

<script>
    // --- SUPABASE CONFIG ---
    const SB_URL = 'https://jxifynhuxcigcomhfxad.supabase.co';
    const SB_KEY = 'sb_publishable_guA6fUpSMtATt1sZcPtK0g_vFVVlEig';
    const supabase = window.supabase.createClient(SB_URL, SB_KEY);
    const BUCKET = 'spine-assets';

    // --- APP STATE ---
    const spineGroups = {};
    let activeObj = null;
    let app = null;

    // --- INIT PIXI ENGINE ---
    (async () => {
        app = new PIXI.Application();
        await app.init({ 
            width: 1920, height: 1080, 
            backgroundColor: 0x333333, 
            resolution: window.devicePixelRatio || 1, 
            autoDensity: true 
        });
        document.getElementById('canvas-wrapper').appendChild(app.canvas);

        app.stage.eventMode = 'static';
        app.stage.on('pointerdown', (e) => { if(e.target === app.stage) selectObject(null); });

        // Resize handler
        window.addEventListener('resize', () => {
            const wrapper = document.getElementById('canvas-wrapper');
            app.renderer.resize(wrapper.clientWidth, wrapper.clientHeight);
        });
    })();

    // --- FOLDER/FILE HANDLING ---
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');

    dropZone.onclick = () => fileInput.click();
    fileInput.onchange = (e) => processFiles(Array.from(e.target.files));

    dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('dragover'); };
    dropZone.ondragleave = () => dropZone.classList.remove('dragover');
    dropZone.ondrop = async (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        const files = [];
        if (e.dataTransfer.items) {
            for (let item of e.dataTransfer.items) {
                const entry = item.webkitGetAsEntry();
                if (entry) await scanEntry(entry, files);
            }
        }
        processFiles(files);
    };

    async function scanEntry(entry, fileList) {
        if (entry.isFile) {
            const file = await new Promise(res => entry.file(res));
            fileList.push(file);
        } else if (entry.isDirectory) {
            const reader = entry.createReader();
            const entries = await new Promise(res => reader.readEntries(res));
            for (let e of entries) await scanEntry(e, fileList);
        }
    }

    function processFiles(files) {
        files.forEach(f => {
            const match = f.name.match(/(.+)\.(json|skel|atlas|png)$/i);
            if (!match) return;
            const groupName = match[1];
            if (!spineGroups[groupName]) spineGroups[groupName] = { name: groupName };
            spineGroups[groupName][match[2].toLowerCase()] = f;
        });
        renderAssetList();
    }

    function renderAssetList() {
        const list = document.getElementById('asset-list');
        list.innerHTML = '';
        Object.values(spineGroups).forEach(g => {
            const isReady = (g.json || g.skel) && g.atlas && g.png;
            const div = document.createElement('div');
            div.className = `asset-item ${isReady ? 'ready' : ''}`;
            div.innerHTML = `
                <div style="font-weight:bold; color:#eee">${g.name}</div>
                <button class="btn-action" onclick="uploadAndAdd('${g.name}')" ${!isReady ? 'disabled' : ''}>
                    ${isReady ? 'Upload & Add' : 'Missing Assets'}
                </button>
            `;
            list.appendChild(div);
        });
    }

    // --- SUPABASE UPLOAD & SPINE SPAWN ---
    async function uploadAndAdd(name) {
        const overlay = document.getElementById('loading-overlay');
        const status = document.getElementById('load-status');
        overlay.style.display = 'flex';

        try {
            const g = spineGroups[name];
            const uid = Date.now();
            const folder = `${name}_${uid}/`;

            status.innerText = "Step 1/3: Uploading Texture...";
            await supabase.storage.from(BUCKET).upload(folder + g.png.name, g.png);

            status.innerText = "Step 2/3: Uploading Atlas...";
            await supabase.storage.from(BUCKET).upload(folder + g.atlas.name, g.atlas);
            const atlasUrl = supabase.storage.from(BUCKET).getPublicUrl(folder + g.atlas.name).data.publicUrl;

            status.innerText = "Step 3/3: Uploading Skeleton...";
            const dataFile = g.json || g.skel;
            await supabase.storage.from(BUCKET).upload(folder + dataFile.name, dataFile);
            const dataUrl = supabase.storage.from(BUCKET).getPublicUrl(folder + dataFile.name).data.publicUrl;

            // PIXI SPINE LOADING
            const atlasKey = `at_${uid}`;
            const dataKey = `sk_${uid}`;
            PIXI.Assets.add({ alias: atlasKey, src: atlasUrl, format: '.atlas' });
            PIXI.Assets.add({ alias: dataKey, src: dataUrl, format: g.json ? '.json' : '.skel' });

            await PIXI.Assets.load([atlasKey, dataKey]);
            const spineObj = spine.Spine.from({ skeleton: dataKey, atlas: atlasKey });

            setupObject(spineObj, name);
        } catch (err) {
            alert("Upload Failed: " + err.message);
        } finally {
            overlay.style.display = 'none';
        }
    }

    function setupObject(obj, name) {
        obj.name = name;
        obj.x = app.renderer.width / 2;
        obj.y = app.renderer.height / 2;
        obj.eventMode = 'static';
        obj.cursor = 'move';

        // DRAG LOGIC
        let dragging = false;
        obj.on('pointerdown', (e) => {
            e.stopPropagation();
            selectObject(obj);
            dragging = true;
        });
        window.addEventListener('pointermove', (e) => {
            if (dragging && activeObj === obj) {
                const rect = document.getElementById('canvas-wrapper').getBoundingClientRect();
                obj.x = (e.clientX - rect.left) * (app.renderer.width / rect.width);
                obj.y = (e.clientY - rect.top) * (app.renderer.height / rect.height);
                syncInspector();
            }
        });
        window.addEventListener('pointerup', () => dragging = false);

        app.stage.addChild(obj);
        selectObject(obj);
    }

    // --- UNITY-LIKE INSPECTOR LOGIC ---
    function selectObject(obj) {
        if (activeObj) activeObj.alpha = 1.0;
        activeObj = obj;

        const content = document.getElementById('ins-content');
        const title = document.getElementById('ins-title');

        if (!obj) {
            content.style.display = 'none';
            title.innerText = "No Selection";
            return;
        }

        activeObj.alpha = 0.7;
        content.style.display = 'flex';
        title.innerText = obj.name;

        // ANIMATIONS
        const animSel = document.getElementById('ins-anim');
        animSel.innerHTML = '';
        obj.skeleton.data.animations.forEach(a => {
            const opt = document.createElement('option');
            opt.value = opt.innerText = a.name;
            animSel.appendChild(opt);
        });
        if (obj.state.tracks[0]) animSel.value = obj.state.tracks[0].animation.name;

        // SKINS
        const skinSel = document.getElementById('ins-skin');
        skinSel.innerHTML = '';
        obj.skeleton.data.skins.forEach(s => {
            const opt = document.createElement('option');
            opt.value = opt.innerText = s.name;
            skinSel.appendChild(opt);
        });
        if (obj.skeleton.skin) skinSel.value = obj.skeleton.skin.name;

        syncInspector();
    }

    function syncInspector() {
        if (!activeObj) return;
        document.getElementById('ins-x').value = Math.round(activeObj.x);
        document.getElementById('ins-y').value = Math.round(activeObj.y);
        document.getElementById('ins-scale').value = activeObj.scale.x.toFixed(2);
    }

    // INSPECTOR INPUTS
    document.getElementById('ins-x').oninput = (e) => activeObj.x = Number(e.target.value);
    document.getElementById('ins-y').oninput = (e) => activeObj.y = Number(e.target.value);
    document.getElementById('ins-scale').oninput = (e) => {
        const val = Number(e.target.value);
        activeObj.scale.set(val, val);
    };
    document.getElementById('ins-anim').onchange = (e) => activeObj.state.setAnimation(0, e.target.value, true);
    document.getElementById('ins-skin').onchange = (e) => {
        activeObj.skeleton.setSkinByName(e.target.value);
        activeObj.skeleton.setSlotsToSetupPose();
    };

    function deleteActive() {
        if (activeObj) {
            app.stage.removeChild(activeObj);
            selectObject(null);
        }
    }

    async function uploadAll() {
        const readyKeys = Object.keys(spineGroups).filter(k => (spineGroups[k].json || spineGroups[k].skel) && spineGroups[k].atlas && spineGroups[k].png);
        for (const key of readyKeys) {
            await uploadAndAdd(key);
        }
    }
</script>
</body>
</html>
