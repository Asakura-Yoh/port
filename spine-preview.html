<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spine2D Pro Web Tool - Workspace</title>
    <link rel="stylesheet" href="https://unpkg.com/@esotericsoftware/spine-player@4.2.47/dist/spine-player.css">
    <style>
        :root {
            --bg-color: #121212; --panel-bg: #1e1e1e; --card-bg: #2d2d2d;
            --text-color: #e0e0e0; --accent-color: #007acc; --hover-color: #0098ff;
            --folder-color: #e84a5f; --folder-hover: #ff5c72; --border-color: #333;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 20px; font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-color); color: var(--text-color);
            height: 100vh; overflow: hidden; display: flex; flex-direction: column;
        }
        .btn { color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        .upload-btn { background-color: var(--accent-color); }
        .folder-btn { background-color: var(--folder-color); }
        #status-display { margin-top: 15px; padding: 12px; border-radius: 6px; font-family: monospace; display: none; text-align: center; width: 100%; max-width: 650px; }
        .status-info { background: #1e3a5f; color: #66ccff; border: 1px solid #4db8ff; display: block !important; }
        .status-error { background: #3a1a1a; color: #ff5555; border: 1px solid #ff5555; display: block !important; }
        #upload-screen { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .upload-container { background-color: var(--panel-bg); padding: 40px; border-radius: 12px; border: 2px dashed #555; text-align: center; width: 100%; max-width: 650px; }
        #gallery-screen, #workspace-screen { display: none; flex: 1; width: 100%; overflow: hidden; }
        #gallery-screen { flex-direction: column; max-width: 1400px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .anim-card { background-color: var(--card-bg); border-radius: 8px; padding: 12px; cursor: pointer; border: 1px solid #444; text-align: center; transition: 0.2s; }
        .anim-card:hover { border-color: var(--accent-color); transform: translateY(-3px); }
        .anim-icon { width: 120px; height: 120px; background-color: #111; border-radius: 8px; margin-bottom: 10px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .anim-icon img { width: 100%; height: 100%; object-fit: contain; }
        #sidebar { width: 320px; background-color: var(--panel-bg); display: flex; flex-direction: column; border: 1px solid var(--border-color); border-radius: 8px; }
        .list-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; cursor: pointer; border-radius: 6px; margin-bottom: 4px; border: 1px solid transparent; }
        .list-item.active { background-color: rgba(0, 122, 204, 0.2); border-color: var(--accent-color); }
        .list-item-thumb { width: 34px; height: 34px; border-radius: 4px; object-fit: contain; margin-right: 10px; background: #111; }
        #preview-area { flex: 1; background-color: #0b0b0b; border-radius: 8px; position: relative; border: 1px solid var(--border-color); margin-left: 20px; }
        #hidden-parser { position: fixed; top: 0; left: 0; width: 300px; height: 300px; z-index: 9999; opacity: 0.02; pointer-events: none; }
    </style>
</head>
<body>
    <div id="upload-screen">
        <div class="upload-container" id="drop-zone">
            <h2>Spine2D Pro Web Tool</h2>
            <p>Drop folder chứa <strong>.json/.skel, .atlas, .png</strong> vào đây</p>
            <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
                <button class="btn upload-btn" onclick="document.getElementById('file-input').click()">Chọn Files</button>
                <button class="btn folder-btn" onclick="document.getElementById('folder-input').click()">Chọn Folder</button>
            </div>
            <input type="file" id="file-input" multiple style="display:none">
            <input type="file" id="folder-input" webkitdirectory directory multiple style="display:none">
        </div>
        <div id="status-display"></div>
    </div>

    <div id="gallery-screen">
        <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>Thư viện Animations</h2>
            <button class="btn" style="background:#444" onclick="location.reload()">Reset Workspace</button>
        </div>
        <div id="gallery-content" style="flex:1; overflow-y:auto"></div>
    </div>

    <div id="workspace-screen">
        <div id="sidebar">
            <div style="padding:15px; border-bottom:1px solid #333">
                <button class="btn" style="width:100%; background:#444" onclick="showGallery()">🔙 Trở lại Gallery</button>
            </div>
            <div id="sidebar-list" style="flex:1; overflow-y:auto; padding:10px"></div>
        </div>
        <div id="preview-area">
            <div id="player-wrapper" style="width:100%; height:100%"></div>
        </div>
    </div>

    <div id="hidden-parser"></div>

    <script src="https://unpkg.com/@esotericsoftware/spine-player@4.2.47/dist/iife/spine-player.js"></script>
    <script>
        let globalRawURIs = {}, globalParsedData = [], mainPlayer = null;
        const statusDisplay = document.getElementById('status-display');

        function logMessage(msg, type='info') {
            statusDisplay.style.display = 'block';
            statusDisplay.className = `status-${type}`;
            statusDisplay.innerText = msg;
        }

        const fileToDataURI = file => new Promise(res => {
            const r = new FileReader();
            r.onload = () => res(r.result);
            r.readAsDataURL(file);
        });

        async function processFiles(files) {
            logMessage('Đang nạp dữ liệu...', 'info');
            globalRawURIs = {};
            globalParsedData = [];
            
            for(let f of files) globalRawURIs[f.name] = await fileToDataURI(f);
            
            const dataFiles = Array.from(files).filter(f => f.name.endsWith('.json') || f.name.endsWith('.skel'));
            const atlasFiles = Array.from(files).filter(f => f.name.endsWith('.atlas') || f.name.endsWith('.txt'));

            if (dataFiles.length === 0) {
                logMessage('Lỗi: Không tìm thấy file .json hoặc .skel', 'error');
                return;
            }

            for(let d of dataFiles) {
                const base = d.name.substring(0, d.name.lastIndexOf('.'));
                const atlas = atlasFiles.find(a => a.name.includes(base)) || atlasFiles[0];
                if(atlas) await parseProject(d, atlas);
            }
            showGallery();
        }

        async function parseProject(dataFile, atlasFile) {
            return new Promise(res => {
                const config = {
                    atlasUrl: atlasFile.name,
                    rawDataURIs: globalRawURIs,
                    showControls: false,
                    physics: true, // Nạp module vật lý
                    success: async player => {
                        const anims = player.skeleton.data.animations;
                        const results = [];
                        
                        const drawMethod = player.drawFrame ? 'drawFrame' : 'render';
                        const originalDraw = player[drawMethod].bind(player);
                        let captureTrigger = null;

                        player[drawMethod] = function() {
                            originalDraw();
                            if(captureTrigger) {
                                captureTrigger(player.canvas.toDataURL());
                                captureTrigger = null;
                            }
                        };

                        for(let a of anims) {
                            logMessage(`Render: ${a.name}...`, 'info');
                            player.animationState.setAnimation(0, a.name, true);
                            
                            // Cập nhật pose để tránh render đen
                            player.animationState.update(0.1);
                            player.animationState.apply(player.skeleton);
                            player.skeleton.updateWorldTransform();
                            
                            const thumb = await new Promise(r => {
                                captureTrigger = r;
                                setTimeout(() => r(null), 600);
                            });
                            results.push({ name: a.name, thumb, duration: a.duration });
                        }
                        globalParsedData.push({ name: dataFile.name, dataFile, atlasFile, animations: results });
                        player.dispose();
                        res();
                    },
                    error: (p, e) => { 
                        logMessage(`Lỗi parse ${dataFile.name}: ${e}`, 'error');
                        res(); 
                    }
                };
                if(dataFile.name.endsWith('.skel')) config.skelUrl = dataFile.name;
                else config.jsonUrl = dataFile.name;
                new spine.SpinePlayer("hidden-parser", config);
            });
        }

        function showGallery() {
            document.getElementById('upload-screen').style.display = 'none';
            document.getElementById('workspace-screen').style.display = 'none';
            document.getElementById('gallery-screen').style.display = 'flex';
            const container = document.getElementById('gallery-content');
            container.innerHTML = globalParsedData.map(p => `
                <div style="margin-bottom:30px">
                    <h3 style="border-bottom:1px solid #444; padding-bottom:10px">Skeleton: ${p.name}</h3>
                    <div class="grid">${p.animations.map(a => `
                        <div class="anim-card" onclick="openWorkspace('${p.name}', '${a.name}')">
                            <div class="anim-icon">${a.thumb ? `<img src="${a.thumb}">` : '<span style="color:#555">No Thumb</span>'}</div>
                            <div style="font-weight:bold; font-size:14px">${a.name}</div>
                        </div>
                    `).join('')}</div>
                </div>
            `).join('');
        }

        function openWorkspace(skelName, animName) {
            document.getElementById('gallery-screen').style.display = 'none';
            document.getElementById('workspace-screen').style.display = 'flex';
            const proj = globalParsedData.find(p => p.name === skelName);
            const list = document.getElementById('sidebar-list');
            list.innerHTML = `<h3>Skeleton: ${skelName}</h3>` + proj.animations.map(a => `
                <div class="list-item ${a.name === animName ? 'active' : ''}" onclick="playAnim('${skelName}', '${a.name}', this)">
                    <div style="display:flex; align-items:center">
                        <img class="list-item-thumb" src="${a.thumb || ''}">
                        <span style="font-size:13px">${a.name}</span>
                    </div>
                </div>
            `).join('');
            playAnim(skelName, animName);
        }

        function playAnim(skelName, animName, el) {
            if(el) {
                document.querySelectorAll('.list-item').forEach(i => i.classList.remove('active'));
                el.classList.add('active');
            }
            if(mainPlayer) {
                mainPlayer.dispose();
                document.getElementById('player-wrapper').innerHTML = '';
            }
            const proj = globalParsedData.find(p => p.name === skelName);
            const config = {
                atlasUrl: proj.atlasFile.name,
                rawDataURIs: globalRawURIs,
                animation: animName,
                physics: true,
                alpha: true,
                backgroundColor: "#00000000",
                showControls: true
            };
            if(proj.dataFile.name.endsWith('.skel')) config.skelUrl = proj.dataFile.name;
            else config.jsonUrl = proj.dataFile.name;
            mainPlayer = new spine.SpinePlayer("player-wrapper", config);
        }

        const dz = document.getElementById('drop-zone');
        dz.ondragover = e => { e.preventDefault(); dz.style.borderColor = '#007acc'; dz.style.backgroundColor = '#1a2a3a'; };
        dz.ondragleave = () => { dz.style.borderColor = '#555'; dz.style.backgroundColor = 'transparent'; };
        dz.ondrop = e => { e.preventDefault(); dz.style.borderColor = '#555'; dz.style.backgroundColor = 'transparent'; processFiles(e.dataTransfer.files); };
        document.getElementById('file-input').onchange = e => processFiles(e.target.files);
        document.getElementById('folder-input').onchange = e => processFiles(e.target.files);
    </script>
</body>
</html>
