<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spine 4.2 Web Previewer - Elite Edition</title>
    
    <script src="https://unpkg.com/pixi.js@8.x/dist/pixi.min.js"></script>
    <script src="https://unpkg.com/@esotericsoftware/spine-pixi-v8@4.2/dist/iife/spine-pixi-v8.js"></script>
    
    <style>
        :root {
            --bg-dark: #1e1e1e;
            --bg-panel: #252526;
            --bg-canvas: #333333;
            --accent: #007acc;
            --text: #cccccc;
            --border: #3e3e42;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- LEFT SIDEBAR (Hierarchy/Project) --- */
        #sidebar-left {
            width: 280px;
            background-color: var(--bg-panel);
            border-right: 1px solid #000;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        #drop-zone {
            padding: 20px;
            text-align: center;
            border: 2px dashed #555;
            margin: 10px;
            background-color: #2d2d30;
            cursor: pointer;
            transition: 0.2s;
            font-size: 14px;
        }
        
        #drop-zone:hover { background-color: #3e3e42; border-color: #888; }
        #drop-zone.dragover { border-color: var(--accent); background-color: #1a2a3a; }

        .section-title {
            padding: 8px 12px;
            background-color: #383838;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #asset-list { flex-grow: 1; overflow-y: auto; padding: 10px; }

        .asset-item {
            background: #3e3e42;
            padding: 10px;
            margin-bottom: 5px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .asset-item.ready { border-left: 4px solid #4caf50; }
        .asset-item.missing { border-left: 4px solid #f44336; }

        button.btn-add {
            padding: 4px 10px;
            cursor: pointer;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 3px;
            font-weight: bold;
        }
        button.btn-add:hover { background: #005f9e; }

        /* --- MAIN VIEW (Scene) --- */
        #main-view {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #111;
            padding: 20px;
            position: relative;
        }

        #canvas-wrapper {
            width: 100%;
            max-width: 1920px;
            aspect-ratio: 16 / 9;
            background-color: var(--bg-canvas);
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            position: relative;
            overflow: hidden;
        }

        canvas { width: 100%; height: 100%; display: block; }

        #toolbar {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            pointer-events: none;
            z-index: 10;
        }

        /* --- RIGHT SIDEBAR (Inspector) --- */
        #sidebar-right {
            width: 300px;
            background-color: var(--bg-panel);
            border-left: 1px solid #000;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .inspector-panel {
            padding: 15px;
            display: none; /* Hidden until an object is selected */
        }

        .inspector-group { margin-bottom: 15px; }
        .inspector-group label { display: block; font-size: 12px; margin-bottom: 5px; color: #aaa; }
        .inspector-group select {
            width: 100%;
            padding: 6px;
            background: #333;
            color: #fff;
            border: 1px solid var(--border);
            border-radius: 3px;
            outline: none;
        }
        .inspector-group select:focus { border-color: var(--accent); }

        .btn-delete {
            width: 100%;
            padding: 8px;
            background: #a83232;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-delete:hover { background: #c23a3a; }

    </style>
</head>
<body>

    <div id="sidebar-left">
        <input type="file" id="file-input" multiple webkitdirectory directory style="display: none;">
        
        <div id="drop-zone">
            📁 Kéo thả Folder / Files<br>
            hoặc <strong>Click</strong> vào đây<br>
        </div>
        <div class="section-title">Project Assets</div>
        <div id="asset-list"></div>
    </div>

    <div id="main-view">
        <div id="canvas-wrapper">
            <div id="toolbar">
                Left Click: Select/Move | Scroll Wheel: Scale
            </div>
            </div>
    </div>

    <div id="sidebar-right">
        <div class="section-title">Inspector</div>
        
        <div id="inspector-content" class="inspector-panel">
            <div style="font-size: 16px; font-weight: bold; margin-bottom: 15px; color: var(--accent);" id="insp-name">Spine Object</div>
            
            <div class="inspector-group">
                <label>Animation</label>
                <select id="insp-anim"></select>
            </div>

            <div class="inspector-group">
                <label>Skin</label>
                <select id="insp-skin"></select>
            </div>

            <button class="btn-delete" onclick="deleteActiveObject()">Xóa khỏi Scene</button>
        </div>
        
        <div id="inspector-empty" style="padding: 20px; text-align: center; color: #666; font-size: 13px;">
            Click vào một nhân vật để xem thuộc tính.
        </div>
    </div>

<script>
    // --- APP STATE ---
    const spineFiles = {};
    let activeSpineObj = null;
    let app = null;

    // --- INIT PIXI v8 ENGINE ---
    (async function initEngine() {
        app = new PIXI.Application();
        await app.init({
            width: 1920,
            height: 1080,
            backgroundColor: 0x333333,
            resolution: window.devicePixelRatio || 1,
            autoDensity: true
        });
        document.getElementById('canvas-wrapper').appendChild(app.canvas);

        // Click on background to deselect
        app.stage.eventMode = 'static';
        app.stage.hitArea = new PIXI.Rectangle(0, 0, 1920, 1080);
        app.stage.on('pointerdown', (e) => {
            if (e.target === app.stage) selectObject(null);
        });

        // Scene Scale Interaction
        app.canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (!activeSpineObj) return;
            const scaleFactor = e.deltaY < 0 ? 1.1 : 0.9;
            activeSpineObj.scale.x *= scaleFactor;
            activeSpineObj.scale.y *= scaleFactor;
        });
    })();

    // --- DRAG & DROP & CLICK LOGIC ---
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));

    dropZone.addEventListener('drop', async (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        
        const files = [];
        const items = e.dataTransfer.items;
        
        if (items) {
            const promises = [];
            for (let i = 0; i < items.length; i++) {
                const item = items[i].webkitGetAsEntry();
                if (item) promises.push(traverseFileTree(item, files));
            }
            await Promise.all(promises);
        } else {
            files.push(...Array.from(e.dataTransfer.files));
        }
        processFiles(files);
    });

    function traverseFileTree(item, filesList) {
        return new Promise((resolve) => {
            if (item.isFile) {
                item.file((file) => { filesList.push(file); resolve(); });
            } else if (item.isDirectory) {
                const dirReader = item.createReader();
                dirReader.readEntries(async (entries) => {
                    const promises = [];
                    for (let i = 0; i < entries.length; i++) promises.push(traverseFileTree(entries[i], filesList));
                    await Promise.all(promises);
                    resolve();
                });
            }
        });
    }

    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => { processFiles(Array.from(e.target.files)); fileInput.value = ''; });

    // --- FILE PROCESSING ---
    function processFiles(files) {
        files.forEach(file => {
            const nameMatch = file.name.match(/(.+)\.(json|skel|atlas|png)$/i);
            if (!nameMatch) return;

            const fullName = nameMatch[1];
            const baseName = fullName.substring(fullName.lastIndexOf('/') + 1).substring(fullName.lastIndexOf('\\') + 1);
            const ext = nameMatch[2].toLowerCase();

            if (!spineFiles[baseName]) spineFiles[baseName] = {};
            spineFiles[baseName][ext] = file;
        });
        renderAssetList();
    }

    function renderAssetList() {
        const listContainer = document.getElementById('asset-list');
        listContainer.innerHTML = '';

        Object.keys(spineFiles).forEach(name => {
            const group = spineFiles[name];
            const hasData = group.json || group.skel;
            const isReady = hasData && group.atlas && group.png;
            
            const div = document.createElement('div');
            div.className = `asset-item ${isReady ? 'ready' : 'missing'}`;
            
            div.innerHTML = `
                <div>
                    <strong>${name}</strong><br>
                    <small style="color:#888">
                        ${group.json ? '✓ JSON ' : (group.skel ? '✓ SKEL ' : '')}
                        ${group.atlas ? '✓ Atlas ' : ''}
                        ${group.png ? '✓ PNG' : ''}
                    </small>
                </div>
                ${isReady ? `<button class="btn-add" onclick="spawnToScene('${name}')">Add</button>` : ''}
            `;
            listContainer.appendChild(div);
        });
    }

    // --- SPINE 4.2+ SCENE INSTANTIATION ---
    async function spawnToScene(baseName) {
        try {
            const files = spineFiles[baseName];
            const uniqueId = Date.now(); // Prevent cache collisions

            // 1. Process PNG (Append fake extension to hash so Pixi detects format)
            const safePngAlias = `${baseName}_texture_${uniqueId}`;
            const pngUrl = URL.createObjectURL(files.png) + '#' + files.png.name;
            PIXI.Assets.add({ alias: safePngAlias, src: pngUrl });

            // 2. Process Atlas (Replace original image reference with our safe alias)
            let atlasText = await files.atlas.text();
            atlasText = atlasText.replace(files.png.name, safePngAlias);
            const atlasBlob = new Blob([atlasText], { type: 'text/plain' });
            const atlasAlias = `${baseName}_atlas_${uniqueId}`;
            const atlasUrl = URL.createObjectURL(atlasBlob) + '#' + files.atlas.name;
            PIXI.Assets.add({ alias: atlasAlias, src: atlasUrl });

            // 3. Process JSON/SKEL Data
            const dataFile = files.json || files.skel;
            const dataAlias = `${baseName}_data_${uniqueId}`;
            const dataUrl = URL.createObjectURL(dataFile) + '#' + dataFile.name;
            PIXI.Assets.add({ alias: dataAlias, src: dataUrl });

            // 4. Load all via Pixi Asset Manager
            await PIXI.Assets.load([safePngAlias, atlasAlias, dataAlias]);

            // 5. Build Spine Object
            const spineDisplayObj = spine.Spine.from({
                skeleton: dataAlias,
                atlas: atlasAlias
            });

            spineDisplayObj.name = baseName;
            spineDisplayObj.x = 1920 / 2;
            spineDisplayObj.y = 1080 / 2;
            
            // Default Play
            if (spineDisplayObj.state.data.skeletonData.animations.length > 0) {
                const firstAnim = spineDisplayObj.state.data.skeletonData.animations[0].name;
                spineDisplayObj.state.setAnimation(0, firstAnim, true);
            }

            setupInteractions(spineDisplayObj);
            app.stage.addChild(spineDisplayObj);
            
            // Auto-select the newly spawned object
            selectObject(spineDisplayObj);

        } catch (error) {
            console.error("Spine Pipeline Error:", error);
            alert("Lỗi Load Asset: " + error.message);
        }
    }

    // --- PIXI v8 TRANSFORM CONTROLS ---
    function setupInteractions(obj) {
        obj.eventMode = 'dynamic';
        obj.cursor = 'move';
        let dragging = false;
        let dragStartPos = { x: 0, y: 0 };

        obj.on('pointerdown', (event) => {
            event.stopPropagation(); // Prevent stage click
            selectObject(obj);
            dragging = true;
            app.stage.setChildIndex(obj, app.stage.children.length - 1);
            
            // Keep offset from cursor
            dragStartPos = { 
                x: event.global.x - obj.x, 
                y: event.global.y - obj.y 
            };
        });

        const onDragEnd = () => { dragging = false; };
        
        obj.on('pointerup', onDragEnd);
        obj.on('pointerupoutside', onDragEnd);

        obj.on('pointermove', (event) => {
            if (dragging) {
                obj.x = event.global.x - dragStartPos.x;
                obj.y = event.global.y - dragStartPos.y;
            }
        });
    }

    // --- INSPECTOR LOGIC ---
    const inspPanel = document.getElementById('inspector-content');
    const inspEmpty = document.getElementById('inspector-empty');
    const inspName = document.getElementById('insp-name');
    const animSelect = document.getElementById('insp-anim');
    const skinSelect = document.getElementById('insp-skin');

    function selectObject(obj) {
        // Reset previous highlight
        if (activeSpineObj) activeSpineObj.alpha = 1.0;
        
        activeSpineObj = obj;

        if (!obj) {
            inspPanel.style.display = 'none';
            inspEmpty.style.display = 'block';
            return;
        }

        // Highlight new object
        obj.alpha = 0.8;
        inspEmpty.style.display = 'none';
        inspPanel.style.display = 'block';
        inspName.textContent = obj.name || "Spine Object";

        // Populate Animations
        animSelect.innerHTML = '';
        obj.skeleton.data.animations.forEach(anim => {
            const option = document.createElement('option');
            option.value = anim.name;
            option.textContent = anim.name;
            animSelect.appendChild(option);
        });
        
        // Sync current animation
        if (obj.state.tracks[0] && obj.state.tracks[0].animation) {
            animSelect.value = obj.state.tracks[0].animation.name;
        }

        // Populate Skins
        skinSelect.innerHTML = '';
        obj.skeleton.data.skins.forEach(skin => {
            const option = document.createElement('option');
            option.value = skin.name;
            option.textContent = skin.name;
            skinSelect.appendChild(option);
        });
        
        // Sync current skin
        if (obj.skeleton.skin) {
            skinSelect.value = obj.skeleton.skin.name;
        }
    }

    // Handle Inspector Changes
    animSelect.addEventListener('change', (e) => {
        if (activeSpineObj) {
            activeSpineObj.state.setAnimation(0, e.target.value, true);
        }
    });

    skinSelect.addEventListener('change', (e) => {
        if (activeSpineObj) {
            activeSpineObj.skeleton.setSkinByName(e.target.value);
            activeSpineObj.skeleton.setSlotsToSetupPose(); // Critical for proper skin application
        }
    });

    function deleteActiveObject() {
        if (activeSpineObj) {
            app.stage.removeChild(activeSpineObj);
            activeSpineObj.destroy({ children: true });
            selectObject(null);
        }
    }

</script>
</body>
</html>
