<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spine2D 4.2 Web Previewer - PixiJS v8</title>
    
    <script src="https://unpkg.com/pixi.js@8.1.0/dist/pixi.min.js"></script>
    <script src="https://unpkg.com/@esotericsoftware/spine-pixi-v8@4.2.106/dist/iife/spine-pixi-v8.js"></script>
    
    <style>
        :root {
            --bg-dark: #1e1e1e;
            --bg-panel: #252526;
            --bg-canvas: #333333;
            --accent: #007acc;
            --text: #cccccc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #sidebar {
            width: 300px;
            background-color: var(--bg-panel);
            border-right: 1px solid #000;
            display: flex;
            flex-direction: column;
        }

        #drop-zone {
            padding: 20px;
            text-align: center;
            border: 2px dashed #555;
            margin: 10px;
            background-color: #2d2d30;
            cursor: pointer;
            transition: 0.2s;
        }
        
        #drop-zone:hover { background-color: #3e3e42; border-color: #888; }
        #drop-zone.dragover { border-color: var(--accent); background-color: #1a2a3a; }

        .section-title {
            padding: 10px;
            background-color: #383838;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }

        #asset-list { flex-grow: 1; overflow-y: auto; padding: 10px; }

        .asset-item {
            background: #3e3e42;
            padding: 10px;
            margin-bottom: 5px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .asset-item.ready { border-left: 4px solid #4caf50; }
        .asset-item.missing { border-left: 4px solid #f44336; }

        #main-view {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #111;
            padding: 20px;
            position: relative;
        }

        #canvas-wrapper {
            width: 100%;
            max-width: 1920px;
            aspect-ratio: 16 / 9;
            background-color: var(--bg-canvas);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        canvas { width: 100%; height: 100%; display: block; }

        #toolbar {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.6);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <input type="file" id="file-input" multiple webkitdirectory directory style="display: none;">
        
        <div id="drop-zone">
            📁 Kéo thả Folder / Files<br>
            hoặc <strong>Click</strong> vào đây<br>
        </div>
        <div class="section-title">Project Assets</div>
        <div id="asset-list"></div>
    </div>

    <div id="main-view">
        <div id="canvas-wrapper">
            <div id="toolbar">
                Left Click: Move | Scroll Wheel: Scale
            </div>
            </div>
    </div>

<script>
    // --- APP STATE ---
    const spineFiles = {};
    let activeSpineObj = null;
    let app = null;

    // --- INIT PIXI v8 ENGINE ---
    (async function initEngine() {
        app = new PIXI.Application();
        // PixiJS v8 uses async init
        await app.init({
            width: 1920,
            height: 1080,
            backgroundColor: 0x333333,
            resolution: window.devicePixelRatio || 1,
            autoDensity: true
        });
        document.getElementById('canvas-wrapper').appendChild(app.canvas);

        // Setup Scene Scale Interaction
        app.canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (!activeSpineObj) return;
            const scaleFactor = e.deltaY < 0 ? 1.1 : 0.9;
            activeSpineObj.scale.x *= scaleFactor;
            activeSpineObj.scale.y *= scaleFactor;
        });
    })();

    // --- DRAG & DROP & CLICK LOGIC (Unchanged) ---
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));

    dropZone.addEventListener('drop', async (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        
        const files = [];
        const items = e.dataTransfer.items;
        
        if (items) {
            const promises = [];
            for (let i = 0; i < items.length; i++) {
                const item = items[i].webkitGetAsEntry();
                if (item) promises.push(traverseFileTree(item, files));
            }
            await Promise.all(promises);
        } else {
            files.push(...Array.from(e.dataTransfer.files));
        }
        processFiles(files);
    });

    function traverseFileTree(item, filesList) {
        return new Promise((resolve) => {
            if (item.isFile) {
                item.file((file) => { filesList.push(file); resolve(); });
            } else if (item.isDirectory) {
                const dirReader = item.createReader();
                dirReader.readEntries(async (entries) => {
                    const promises = [];
                    for (let i = 0; i < entries.length; i++) promises.push(traverseFileTree(entries[i], filesList));
                    await Promise.all(promises);
                    resolve();
                });
            }
        });
    }

    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => { processFiles(Array.from(e.target.files)); fileInput.value = ''; });

    // --- FILE PROCESSING ---
    function processFiles(files) {
        files.forEach(file => {
            const nameMatch = file.name.match(/(.+)\.(json|skel|atlas|png)$/i);
            if (!nameMatch) return;

            const fullName = nameMatch[1];
            const baseName = fullName.substring(fullName.lastIndexOf('/') + 1).substring(fullName.lastIndexOf('\\') + 1);
            const ext = nameMatch[2].toLowerCase();

            if (!spineFiles[baseName]) spineFiles[baseName] = {};
            spineFiles[baseName][ext] = file;
        });
        renderAssetList();
    }

    function renderAssetList() {
        const listContainer = document.getElementById('asset-list');
        listContainer.innerHTML = '';

        Object.keys(spineFiles).forEach(name => {
            const group = spineFiles[name];
            // Spine 4+ can export as .json or .skel (binary)
            const hasData = group.json || group.skel;
            const isReady = hasData && group.atlas && group.png;
            
            const div = document.createElement('div');
            div.className = `asset-item ${isReady ? 'ready' : 'missing'}`;
            
            div.innerHTML = `
                <div>
                    <strong>${name}</strong><br>
                    <small style="color:#888">
                        ${group.json ? '✓ JSON ' : (group.skel ? '✓ SKEL ' : '')}
                        ${group.atlas ? '✓ Atlas ' : ''}
                        ${group.png ? '✓ PNG' : ''}
                    </small>
                </div>
                ${isReady ? `<button style="padding:4px 8px; cursor:pointer; background:#007acc; color:#fff; border:none; border-radius:3px;" onclick="spawnToScene('${name}')">Add</button>` : ''}
            `;
            listContainer.appendChild(div);
        });
    }

    // --- SPINE 4.2+ SCENE INSTANTIATION ---
    async function spawnToScene(baseName) {
        try {
            const files = spineFiles[baseName];
            
            // Unique ID to prevent collisions if user uploads multiple files with the same internal names
            const uniqueId = Date.now();
            const safePngAlias = `${baseName}_texture_${uniqueId}.png`;
            const atlasAlias = `${baseName}_atlas_${uniqueId}`;
            const dataAlias = `${baseName}_data_${uniqueId}`;

            // 1. Inject PNG into Pixi Assets Cache
            const pngUrl = URL.createObjectURL(files.png);
            PIXI.Assets.add({ alias: safePngAlias, src: pngUrl });

            // 2. Modify Atlas file to strictly link to our injected PNG alias
            let atlasText = await files.atlas.text();
            const originalPngName = files.png.name;
            atlasText = atlasText.replace(originalPngName, safePngAlias); // Swap the filename map
            
            const atlasBlob = new Blob([atlasText], { type: 'text/plain' });
            const atlasUrl = URL.createObjectURL(atlasBlob);
            PIXI.Assets.add({ alias: atlasAlias, src: atlasUrl });

            // 3. Inject JSON or SKEL (Binary)
            const dataFile = files.json || files.skel;
            const dataUrl = URL.createObjectURL(dataFile);
            PIXI.Assets.add({ alias: dataAlias, src: dataUrl });

            // 4. Load all injected assets into memory
            await PIXI.Assets.load([safePngAlias, atlasAlias, dataAlias]);

            // 5. Construct Spine Object using Official API
            const spineDisplayObj = spine.Spine.from({
                skeleton: dataAlias,
                atlas: atlasAlias
            });

            // Center position
            spineDisplayObj.x = 1920 / 2;
            spineDisplayObj.y = 1080 / 2;
            
            // Play first animation
            if (spineDisplayObj.state.data.skeletonData.animations.length > 0) {
                const firstAnim = spineDisplayObj.state.data.skeletonData.animations[0].name;
                spineDisplayObj.state.setAnimation(0, firstAnim, true);
            }

            setupInteractions(spineDisplayObj);
            app.stage.addChild(spineDisplayObj);
            activeSpineObj = spineDisplayObj;

        } catch (error) {
            console.error("Spine Pipeline Error:", error);
            alert("Lỗi Load Asset: Mở F12 Console để xem chi tiết.\n" + error.message);
        }
    }

    // --- PIXI v8 TRANSFORM CONTROLS ---
    function setupInteractions(obj) {
        obj.eventMode = 'dynamic';
        obj.cursor = 'move';
        let dragging = false;
        let dragStartPos = { x: 0, y: 0 };

        obj.on('pointerdown', (event) => {
            activeSpineObj = obj;
            dragging = true;
            obj.alpha = 0.8;
            app.stage.setChildIndex(obj, app.stage.children.length - 1);
            
            // Calculate offset based on global canvas coordinates
            dragStartPos = { 
                x: event.global.x - obj.x, 
                y: event.global.y - obj.y 
            };
        });

        const onDragEnd = () => { 
            dragging = false; 
            obj.alpha = 1.0; 
        };
        
        obj.on('pointerup', onDragEnd);
        obj.on('pointerupoutside', onDragEnd);

        obj.on('pointermove', (event) => {
            if (dragging) {
                obj.x = event.global.x - dragStartPos.x;
                obj.y = event.global.y - dragStartPos.y;
            }
        });
    }

</script>
</body>
</html>
