<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spine2D Web Previewer - Unity Style</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi-spine@4.0.4/dist/pixi-spine.js"></script>
    
    <style>
        :root {
            --bg-dark: #1e1e1e;
            --bg-panel: #252526;
            --bg-canvas: #333333;
            --accent: #007acc;
            --text: #cccccc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #sidebar {
            width: 300px;
            background-color: var(--bg-panel);
            border-right: 1px solid #000;
            display: flex;
            flex-direction: column;
        }

        #drop-zone {
            padding: 20px;
            text-align: center;
            border: 2px dashed #555;
            margin: 10px;
            background-color: #2d2d30;
            cursor: pointer;
            transition: 0.2s;
        }
        
        #drop-zone:hover { background-color: #3e3e42; border-color: #888; }
        #drop-zone.dragover { border-color: var(--accent); background-color: #1a2a3a; }

        .section-title {
            padding: 10px;
            background-color: #383838;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }

        #asset-list { flex-grow: 1; overflow-y: auto; padding: 10px; }

        .asset-item {
            background: #3e3e42;
            padding: 10px;
            margin-bottom: 5px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .asset-item.ready { border-left: 4px solid #4caf50; }
        .asset-item.missing { border-left: 4px solid #f44336; }

        #main-view {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #111;
            padding: 20px;
            position: relative;
        }

        #canvas-wrapper {
            width: 100%;
            max-width: 1920px;
            aspect-ratio: 16 / 9;
            background-color: var(--bg-canvas);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        canvas { width: 100%; height: 100%; display: block; }

        #toolbar {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.6);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <input type="file" id="file-input" multiple accept=".json,.atlas,.png" style="display: none;">
        
        <div id="drop-zone">
            📁 Kéo thả hoặc <strong>Click</strong> vào đây<br>
            <small>để tải lên file (.json, .atlas, .png)</small>
        </div>
        <div class="section-title">Project Assets</div>
        <div id="asset-list"></div>
    </div>

    <div id="main-view">
        <div id="canvas-wrapper">
            <div id="toolbar">
                Left Click: Move | Scroll Wheel: Scale
            </div>
        </div>
    </div>

<script>
    // --- APP STATE ---
    const spineFiles = {};
    let activeSpineObj = null;

    // --- PIXIJS SETUP ---
    const app = new PIXI.Application({
        width: 1920,
        height: 1080,
        backgroundColor: 0x333333,
        resolution: window.devicePixelRatio || 1,
        autoDensity: true
    });
    document.getElementById('canvas-wrapper').appendChild(app.view);

    // --- DRAG & DROP & CLICK LOGIC ---
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    
    // 1. Drag & Drop events
    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        processFiles(Array.from(e.dataTransfer.files));
    });

    // 2. Click to upload events
    dropZone.addEventListener('click', () => {
        fileInput.click(); // Trigger hidden input
    });

    fileInput.addEventListener('change', (e) => {
        processFiles(Array.from(e.target.files));
        fileInput.value = ''; // Reset input to allow selecting the same files again
    });

    // --- FILE PROCESSING ---
    function processFiles(files) {
        files.forEach(file => {
            const nameMatch = file.name.match(/(.+)\.(json|atlas|png)$/i);
            if (!nameMatch) return;

            const baseName = nameMatch[1];
            const ext = nameMatch[2].toLowerCase();

            if (!spineFiles[baseName]) spineFiles[baseName] = {};
            spineFiles[baseName][ext] = file;
        });
        renderAssetList();
    }

    // --- RENDER SIDEBAR UI ---
    function renderAssetList() {
        const listContainer = document.getElementById('asset-list');
        listContainer.innerHTML = '';

        Object.keys(spineFiles).forEach(name => {
            const group = spineFiles[name];
            const isReady = group.json && group.atlas && group.png;
            
            const div = document.createElement('div');
            div.className = `asset-item ${isReady ? 'ready' : 'missing'}`;
            
            div.innerHTML = `
                <div>
                    <strong>${name}</strong><br>
                    <small style="color:#888">
                        ${group.json ? '✓ JSON ' : ''}
                        ${group.atlas ? '✓ Atlas ' : ''}
                        ${group.png ? '✓ PNG' : ''}
                    </small>
                </div>
                ${isReady ? '<button style="padding:4px 8px; cursor:pointer; background:#007acc; color:#fff; border:none; border-radius:3px;" onclick="spawnToScene(\'' + name + '\')">Add</button>' : ''}
            `;
            listContainer.appendChild(div);
        });
    }

    // --- CLIENT-SIDE SPINE PARSER ---
    async function loadLocalSpine(baseName) {
        const files = spineFiles[baseName];
        const pngUrl = URL.createObjectURL(files.png);
        const texture = await PIXI.Assets.load(pngUrl);

        const atlasText = await files.atlas.text();
        const jsonText = await files.json.text();

        const atlas = new PIXI.spine.core.TextureAtlas(atlasText, (line, callback) => {
            callback(PIXI.BaseTexture.from(pngUrl));
        });

        const atlasLoader = new PIXI.spine.core.AtlasAttachmentLoader(atlas);
        const skeletonJson = new PIXI.spine.core.SkeletonJson(atlasLoader);
        
        const rawJsonData = JSON.parse(jsonText);
        return skeletonJson.readSkeletonData(rawJsonData);
    }

    // --- SCENE INSTANTIATION ---
    async function spawnToScene(baseName) {
        try {
            const skeletonData = await loadLocalSpine(baseName);
            const spineDisplayObj = new PIXI.spine.Spine(skeletonData);

            spineDisplayObj.x = 1920 / 2;
            spineDisplayObj.y = 1080 / 2;
            
            if (spineDisplayObj.state.data.skeletonData.animations.length > 0) {
                const firstAnim = spineDisplayObj.state.data.skeletonData.animations[0].name;
                spineDisplayObj.state.setAnimation(0, firstAnim, true);
            }

            setupInteractions(spineDisplayObj);
            app.stage.addChild(spineDisplayObj);
            activeSpineObj = spineDisplayObj;

        } catch (error) {
            console.error("Spine Parsing Error:", error);
            alert("Có lỗi khi parse file Spine. Vui lòng check console (F12).");
        }
    }

    // --- TRANSFORM CONTROLS ---
    function setupInteractions(obj) {
        obj.eventMode = 'dynamic';
        obj.cursor = 'move';
        let dragging = false;
        let dragStartPos = null;

        obj.on('pointerdown', (event) => {
            activeSpineObj = obj;
            dragging = true;
            obj.alpha = 0.8;
            app.stage.setChildIndex(obj, app.stage.children.length - 1);
            
            const newPosition = event.data.getLocalPosition(obj.parent);
            dragStartPos = { x: newPosition.x - obj.x, y: newPosition.y - obj.y };
        });

        const onDragEnd = () => { dragging = false; obj.alpha = 1.0; };
        obj.on('pointerup', onDragEnd);
        obj.on('pointerupoutside', onDragEnd);

        obj.on('pointermove', (event) => {
            if (dragging) {
                const newPosition = event.data.getLocalPosition(obj.parent);
                obj.x = newPosition.x - dragStartPos.x;
                obj.y = newPosition.y - dragStartPos.y;
            }
        });
    }

    app.view.addEventListener('wheel', (e) => {
        e.preventDefault();
        if (!activeSpineObj) return;
        const scaleFactor = e.deltaY < 0 ? 1.1 : 0.9;
        activeSpineObj.scale.x *= scaleFactor;
        activeSpineObj.scale.y *= scaleFactor;
    });

</script>
</body>
</html>
